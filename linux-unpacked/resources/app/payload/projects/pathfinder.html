<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A* Pathfinder</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a14;color:#ccc;min-height:100vh;padding:20px;display:flex;justify-content:center}.container{max-width:700px;width:100%;text-align:center}h1{color:#00d9ff;font-size:1.1rem;margin-bottom:4px}p.sub{color:#555;font-size:0.65rem;margin-bottom:12px}.controls{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}.controls button{padding:5px 12px;border:1px solid rgba(255,255,255,0.06);border-radius:4px;background:transparent;color:#888;cursor:pointer;font-size:0.55rem;font-family:inherit;transition:0.1s}.controls button:hover{border-color:#00d9ff;color:#ccc}.controls button.primary{background:rgba(0,217,255,0.1);border-color:rgba(0,217,255,0.25);color:#00d9ff}#gridCanvas{border:2px solid rgba(255,255,255,0.06);border-radius:6px;cursor:pointer;margin:0 auto;display:block}.stats{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:0.55rem;color:#555}.stats span{display:flex;align-items:center;gap:4px}.stats .val{color:#00d9ff}.legend{display:flex;gap:12px;justify-content:center;margin-bottom:8px;font-size:0.5rem;color:#555}.legend span{display:flex;align-items:center;gap:4px}.legend .swatch{width:12px;height:12px;border-radius:2px}</style></head><body>
<div class="container">
<h1>⭐ A* Pathfinder</h1><p class="sub">Click to place walls · Drag start/end · Visualize shortest path</p>
<div class="legend">
<span><span class="swatch" style="background:#4ade80"></span>Start</span>
<span><span class="swatch" style="background:#f87171"></span>End</span>
<span><span class="swatch" style="background:#333"></span>Wall</span>
<span><span class="swatch" style="background:rgba(0,217,255,0.15)"></span>Visited</span>
<span><span class="swatch" style="background:#00d9ff"></span>Path</span>
</div>
<canvas id="gridCanvas"></canvas>
<div class="controls">
<button onclick="visualize('astar')" class="primary">⭐ A*</button>
<button onclick="visualize('dijkstra')">📏 Dijkstra</button>
<button onclick="visualize('bfs')">🔍 BFS</button>
<button onclick="visualize('greedy')">🎯 Greedy</button>
<button onclick="clearPath()">🗑️ Clear Path</button>
<button onclick="resetGrid()">🔄 Reset</button>
<button onclick="generateMaze()">🏗️ Maze</button>
</div>
<div class="stats">
<span>Algorithm: <span class="val" id="algoDisplay">-</span></span>
<span>Steps: <span class="val" id="stepDisplay">0</span></span>
<span>Path: <span class="val" id="pathDisplay">-</span></span>
<span>Status: <span class="val" id="statusDisplay">Ready</span></span>
</div></div>
<script>
const COLS=40,ROWS=30,CELL=14;let grid=[],start={x:1,y:Math.floor(ROWS/2)},end={x:COLS-2,y:Math.floor(ROWS/2)};
let visited=[],path=[],mouseDown=false,mouseMode='wall',dragTarget=null;
const canvas=document.getElementById('gridCanvas'),ctx=canvas.getContext('2d');
canvas.width=COLS*CELL;canvas.height=ROWS*CELL;

function init(){grid=Array(ROWS).fill(null).map(()=>Array(COLS).fill(0));draw();loadFromStorage()}
function toggleWall(x,y){if(x===start.x&&y===start.y||x===end.x&&y===end.y)return;grid[y][x]=grid[y][x]?0:1;draw();saveToStorage()}

canvas.onmousedown=e=>{const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/CELL),y=Math.floor((e.clientY-r.top)/CELL);if(x<0||x>=COLS||y<0||y>=ROWS)return;mouseDown=true;
  if(Math.abs(x-start.x)<=1&&Math.abs(y-start.y)<=1)dragTarget='start';else if(Math.abs(x-end.x)<=1&&Math.abs(y-end.y)<=1)dragTarget='end';else{mouseMode=grid[y][x]?'clear':'wall';toggleWall(x,y)}}
canvas.onmousemove=e=>{if(!mouseDown)return;const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/CELL),y=Math.floor((e.clientY-r.top)/CELL);if(x<0||x>=COLS||y<0||y>=ROWS)return;
  if(dragTarget==='start'){if(grid[y][x]===0){start={x,y};draw();saveToStorage()}}else if(dragTarget==='end'){if(grid[y][x]===0){end={x,y};draw();saveToStorage()}}else{if(mouseMode==='wall'){grid[y][x]=1;draw()}else{grid[y][x]=0;draw();saveToStorage()}}}
document.onmouseup=()=>{mouseDown=false;dragTarget=null}

function heuristic(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}

async function visualize(type){
  clearPath();const speed=10;
  document.getElementById('algoDisplay').textContent=type;
  document.getElementById('statusDisplay').textContent=`🔄 ${type}...`;
  const open=[],closed=new Set(),parent={},g={},f={};
  const key=p=>`${p.x},${p.y}`;
  open.push(start);g[key(start)]=0;f[key(start)]=heuristic(start,end);
  let found=false,steps=0;

  while(open.length>0&&!found&&steps<5000){
    steps++;
    if(type!=='bfs')open.sort((a,b)=>f[key(a)]-f[key(b)]);
    const current=type==='bfs'?open.shift():open.shift();
    const ck=key(current);
    if(closed.has(ck))continue;
    closed.add(ck);visited.push(current);
    if(current.x===end.x&&current.y===end.y){found=true;let cur=current;while(cur){path.unshift(cur);cur=parent[key(cur)]}break}
    const dirs=type==='greedy'?[[0,-1],[-1,0],[1,0],[0,1]].sort(()=>Math.random()-0.5):[[0,-1],[1,0],[0,1],[-1,0]];
    for(const[dx,dy]of dirs){
      const nx=current.x+dx,ny=current.y+dy;
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS||grid[ny][nx]===1)continue;
      const nk=key({x:nx,y:ny});if(closed.has(nk))continue;
      const ng=g[ck]+1;
      if(g[nk]===undefined||ng<g[nk]){g[nk]=ng;parent[nk]=current;
        f[nk]=ng+heuristic({x:nx,y:ny},end)*(type==='greedy'?100:1);open.push({x:nx,y:ny})}
    }
    if(steps%5===0){draw();await new Promise(r=>setTimeout(r,Math.min(speed,20)))}
  }
  document.getElementById('stepDisplay').textContent=steps;
  document.getElementById('pathDisplay').textContent=found?`${path.length} cells`:'No path';
  document.getElementById('statusDisplay').textContent=found?'✅ Found!':'❌ No path';
  draw();
}

function clearPath(){visited=[];path=[];document.getElementById('pathDisplay').textContent='-';draw()}
function resetGrid(){for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)grid[y][x]=0;clearPath();draw();saveToStorage()}

function generateMaze(){
  resetGrid();
  function carve(x,y){const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
    for(const[dx,dy]of dirs){const nx=x+dx,ny=y+dy;if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&grid[ny][nx]===1){grid[ny][nx]=0;grid[y+dy/2][x+dx/2]=0;carve(nx,ny)}}}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)grid[y][x]=1;
  carve(1,1);draw();saveToStorage();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    ctx.fillStyle=grid[y][x]===1?'#1a1a2e':'#0a0a14';
    ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  }
  ctx.fillStyle='rgba(0,217,255,0.06)';for(const v of visited)ctx.fillRect(v.x*CELL,v.y*CELL,CELL,CELL);
  if(path.length>1){ctx.strokeStyle='#00d9ff';ctx.lineWidth=3;ctx.beginPath();path.forEach((p,i)=>{i===0?ctx.moveTo(p.x*CELL+CELL/2,p.y*CELL+CELL/2):ctx.lineTo(p.x*CELL+CELL/2,p.y*CELL+CELL/2)});ctx.stroke()}
  ctx.fillStyle='#4ade80';ctx.beginPath();ctx.arc(start.x*CELL+CELL/2,start.y*CELL+CELL/2,CELL/3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f87171';ctx.beginPath();ctx.arc(end.x*CELL+CELL/2,end.y*CELL+CELL/2,CELL/3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,ROWS*CELL);ctx.stroke()}
  for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(COLS*CELL,i*CELL);ctx.stroke()}
}

function saveToStorage(){try{localStorage.setItem('pathfinder_grid',JSON.stringify({grid,start,end}))}catch(e){}}
function loadFromStorage(){try{const d=JSON.parse(localStorage.getItem('pathfinder_grid'));if(d&&d.grid){grid=d.grid;start=d.start;end=d.end;return true}}catch(e){}return false}

init();
</script>
</body></html>
