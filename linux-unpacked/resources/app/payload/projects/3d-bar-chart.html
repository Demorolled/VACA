<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📊 3D Bar Chart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f18; font-family: 'Segoe UI', system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: rgba(14, 20, 34, 0.82); border: 1px solid rgba(120, 210, 255, 0.3);
    border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); color: #dce9ff; font-size: 14px; user-select: none;
  }
  #hud button {
    background: rgba(70, 160, 255, 0.16); color: #c9dcff; border: 1px solid rgba(120,180,255,0.4);
    border-radius: 8px; padding: 5px 11px; font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  #hud button:hover { background: rgba(70,160,255,0.35); color: #fff; transform: translateY(-1px); }
  #tooltip {
    position: fixed; display: none; z-index: 20; pointer-events: none;
    background: rgba(12, 18, 30, 0.92); border: 1px solid rgba(120, 210, 255, 0.4);
    border-radius: 8px; padding: 8px 12px; color: #dce9ff; font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(170, 195, 230, 0.5); font-size: 12.5px; white-space: nowrap; }
  #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    color: #ff9c9c; font-size: 16px; padding: 24px; text-align: center; z-index: 20; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="scene"></div>
<div id="fallback">3D unavailable — could not load Three.js (CDN blocked or offline).</div>
<div id="hud">
  <span>📊 Revenue</span>
  <button id="newData">New Data</button>
</div>
<div id="tooltip"></div>
<div id="hint">Drag to orbit · Scroll to zoom · Hover a bar for details</div>

<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') { document.getElementById('fallback').style.display = 'flex'; return; }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f18);
  scene.fog = new THREE.Fog(0x0b0f18, 24, 48);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(9, 8, 12);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('scene').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 5;
  controls.maxDistance = 30;
  controls.target.set(0, 2, 0);

  scene.add(new THREE.AmbientLight(0x8899bb, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(7, 10, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.bias = -0.0004;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x66aaff, 0.4);
  fill.position.set(-6, 4, -6);
  scene.add(fill);

  // grid floor
  const grid = new THREE.GridHelper(14, 14, 0x2a3a5c, 0x182338);
  grid.position.y = 0;
  scene.add(grid);
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(13.5, 0.12, 11),
    new THREE.MeshStandardMaterial({ color: 0x141c2e, roughness: 0.8 })
  );
  base.position.y = -0.06;
  base.receiveShadow = true;
  scene.add(base);

  (function stars() {
    const n = 500, pos = new Float32Array(n * 3);
    for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 80;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.6, fog: false })));
  })();

  // ── Data + bars ─────────────────────────────────────────────────────────
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const barGroup = new THREE.Group();
  scene.add(barGroup);
  let bars = [];          // {mesh, label, value}
  let growT = 0;

  function makeData() {
    return MONTHS.map(m => ({
      label: m,
      value: Math.round(40 + Math.random() * 160),
    }));
  }
  let data = makeData();

  function buildBars(animate) {
    while (barGroup.children.length) barGroup.remove(barGroup.children[0]);
    bars = [];
    const n = data.length;
    const spacing = 1.0;
    data.forEach((d, i) => {
      const h = d.value / 12;
      const w = 0.72;
      const t = i / Math.max(1, n - 1);
      const color = new THREE.Color().setHSL(0.55 - t * 0.45, 0.85, 0.55);
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, 1, w),
        new THREE.MeshStandardMaterial({ color: color, metalness: 0.25, roughness: 0.4, emissive: color, emissiveIntensity: 0.12 })
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.set((i - (n - 1) / 2) * spacing, h / 2, 0);
      mesh.scale.y = animate ? 0.001 : 1;
      mesh.userData = { label: d.label, value: d.value, targetY: h };
      barGroup.add(mesh);
      bars.push(mesh);
    });
  }
  buildBars(true);

  // ── Hover tooltip ───────────────────────────────────────────────────────
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const tooltip = document.getElementById('tooltip');
  let hoveredBar = null;

  renderer.domElement.addEventListener('pointermove', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(bars)[0];
    if (hit) {
      const u = hit.object.userData;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
      tooltip.innerHTML = `<b>${u.label}</b><br>$${u.value}k`;
      if (hoveredBar !== hit.object) {
        if (hoveredBar) hoveredBar.material.emissiveIntensity = 0.12;
        hoveredBar = hit.object;
        hoveredBar.material.emissiveIntensity = 0.45;
      }
    } else {
      tooltip.style.display = 'none';
      if (hoveredBar) { hoveredBar.material.emissiveIntensity = 0.12; hoveredBar = null; }
    }
  });

  document.getElementById('newData').addEventListener('click', () => {
    data = makeData();
    buildBars(true);
    growT = 0;
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ── Grow-in animation + loop ────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    if (growT < 1) {
      growT = Math.min(1, growT + 0.02);
      const k = growT < 0.5 ? 2 * growT * growT : 1 - Math.pow(-2 * growT + 2, 2) / 2;
      bars.forEach(b => {
        b.scale.y = Math.max(0.001, k);
        b.position.y = (b.userData.targetY / 2) * k;
      });
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.__vaca3d = {
    bars: () => bars.length,
    values: () => bars.map(b => b.userData.value),
    newData: () => { data = makeData(); buildBars(true); growT = 0; },
  };
})();
</script>
</body>
</html>
