<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Theme Builder</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a14;color:#ccc;min-height:100vh;padding:12px;display:flex;justify-content:center}.container{max-width:1060px;width:100%}h1{color:#00d9ff;font-size:1rem;margin-bottom:2px;text-align:center}p.sub{color:#555;font-size:0.6rem;margin-bottom:8px;text-align:center}.flex{display:flex;gap:10px}.sidebar{width:240px;flex-shrink:0}.main{flex:1}.panel{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:6px;padding:8px;margin-bottom:6px}.panel-title{color:#888;font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.prop-row{display:flex;align-items:center;gap:6px;margin:3px 0;flex-wrap:wrap}.prop-row label{font-size:0.45rem;color:#555;min-width:70px}.prop-row input[type=color]{width:30px;height:24px;border:none;border-radius:3px;cursor:pointer;background:none;padding:0}.prop-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}.prop-row input[type=color]::-webkit-color-swatch{border:1px solid rgba(255,255,255,0.1);border-radius:3px}.prop-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;outline:none}.prop-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#00d9ff;cursor:pointer}.prop-row select{flex:1;padding:3px 4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:3px;color:#888;font-size:0.45rem;font-family:inherit}.btn{padding:4px 10px;border:1px solid rgba(255,255,255,0.06);border-radius:4px;background:transparent;color:#888;cursor:pointer;font-size:0.5rem;font-family:inherit;transition:0.1s}.btn:hover{border-color:#00d9ff;color:#ccc}.btn.primary{background:rgba(0,217,255,0.08);border-color:rgba(0,217,255,0.2);color:#00d9ff}.btn.accent{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.2);color:#4ade80}.theme-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:16px;margin:4px 0;transition:all 0.2s}.theme-card h3{font-size:0.6rem;margin-bottom:8px}.theme-card .demo-btn{padding:6px 14px;border-radius:4px;border:none;cursor:pointer;font-size:0.5rem;font-family:inherit;margin:2px}.theme-card input{border-radius:4px;padding:6px 10px;font-family:inherit}.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:4px;margin:4px 0}.color-grid .swatch{aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:0.1s}.color-grid .swatch:hover{transform:scale(1.15);border-color:#00d9ff}.val{color:#00d9ff}.css-out{font-family:'Courier New',monospace;font-size:0.45rem;color:#666;padding:6px;background:rgba(255,255,255,0.02);border-radius:4px;max-height:100px;overflow:auto;white-space:pre-wrap}.preset-btn{padding:3px 8px;border:1px solid rgba(255,255,255,0.04);border-radius:3px;background:transparent;color:#666;cursor:pointer;font-size:0.45rem;font-family:inherit;margin:1px;transition:0.1s}.preset-btn:hover{border-color:#00d9ff;color:#ccc}</style></head><body><div class="container">
<h1>🎨 Theme Builder</h1><p class="sub">Design color themes with live preview · Export CSS variables</p>
<div class="flex">
<div class="sidebar">
<div class="panel">
<div class="panel-title">Presets</div>
<button class="preset-btn" onclick="loadPreset('dark')">🌙 Dark</button>
<button class="preset-btn" onclick="loadPreset('light')">☀️ Light</button>
<button class="preset-btn" onclick="loadPreset('ocean')">🌊 Ocean</button>
<button class="preset-btn" onclick="loadPreset('sunset')">🌅 Sunset</button>
<button class="preset-btn" onclick="loadPreset('forest')">🌲 Forest</button>
<button class="preset-btn" onclick="loadPreset('neon')">💜 Neon</button>
</div>
<div class="panel">
<div class="panel-title">Core Colors</div>
<div class="prop-row"><label>Primary</label><input type="color" id="primary" onchange="updateColor('primary',this.value)"></div>
<div class="prop-row"><label>Secondary</label><input type="color" id="secondary" onchange="updateColor('secondary',this.value)"></div>
<div class="prop-row"><label>Accent</label><input type="color" id="accent" onchange="updateColor('accent',this.value)"></div>
<div class="prop-row"><label>Background</label><input type="color" id="background" onchange="updateColor('background',this.value)"></div>
<div class="prop-row"><label>Surface</label><input type="color" id="surface" onchange="updateColor('surface',this.value)"></div>
<div class="prop-row"><label>Text</label><input type="color" id="text" onchange="updateColor('text',this.value)"></div>
<div class="prop-row"><label>Text Muted</label><input type="color" id="textMuted" onchange="updateColor('textMuted',this.value)"></div>
<div class="prop-row"><label>Border</label><input type="color" id="border" onchange="updateColor('border',this.value)"></div>
</div>
<div class="panel">
<div class="panel-title">Border Radius</div>
<div class="prop-row"><label>Radius</label><input type="range" id="radius" min="0" max="20" value="6" oninput="updateRadius(this.value)"><span id="radiusVal" style="font-size:0.45rem;color:#555;min-width:20px">6px</span></div>
</div>
<div class="panel">
<div class="panel-title">Actions</div>
<button class="btn primary" onclick="exportCSS()" style="width:100%;margin-bottom:2px">📋 Copy CSS</button>
<button class="btn" onclick="resetTheme()" style="width:100%">🔄 Reset</button>
</div>
</div>
<div class="main">
<div class="panel">
<div class="panel-title">Live Preview</div>
<div id="previewArea" class="theme-card" style="transition:all 0.2s">
<h3>Sample Content</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
<button class="demo-btn" style="--btn-bg:var(--primary);--btn-color:var(--text-on-primary, #fff)">Primary</button>
<button class="demo-btn" style="--btn-bg:var(--secondary);--btn-color:var(--text-on-secondary, #fff)">Secondary</button>
<button class="demo-btn" style="--btn-bg:var(--accent);--btn-color:var(--text-on-accent, #fff)">Accent</button>
<button class="demo-btn" style="--btn-bg:transparent;border:1px solid var(--border)">Outline</button>
</div>
<div style="display:flex;gap:8px;margin-bottom:8px">
<input placeholder="Sample input..." style="flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text)">
<button class="demo-btn" style="--btn-bg:var(--primary);--btn-color:var(--text-on-primary, #fff)">Submit</button>
</div>
<div style="font-size:0.5rem;margin-bottom:6px;color:var(--text-muted)">Muted text · Border color sample · Small description</div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<div style="background:var(--primary);width:20px;height:20px;border-radius:4px"></div>
<div style="background:var(--secondary);width:20px;height:20px;border-radius:4px"></div>
<div style="background:var(--accent);width:20px;height:20px;border-radius:4px"></div>
<div style="background:var(--surface);width:20px;height:20px;border-radius:4px;border:1px solid var(--border)"></div>
</div>
</div>
</div>
<div class="panel">
<div class="panel-title">Generated CSS Variables</div>
<pre class="css-out" id="cssOutput">:root { /* CSS variables */ }</pre>
</div>
<div class="panel">
<div class="panel-title">Color Palette</div>
<div class="color-grid" id="paletteGrid"></div>
</div>
</div></div></div>
<script>
const theme={
  primary:'#00d9ff',secondary:'#4ade80',accent:'#c084fc',
  background:'#0a0a14',surface:'#1a1a2e',text:'#e0e0e0',textMuted:'#666',border:'rgba(255,255,255,0.08)',
  radius:6
};

function updateColor(key,val){theme[key]=val;applyTheme();saveToStorage()}
function updateRadius(val){theme.radius=parseInt(val);document.getElementById('radiusVal').textContent=val+'px';applyTheme();saveToStorage()}

function applyTheme(){
  const preview=document.getElementById('previewArea');
  preview.style.setProperty('--primary',theme.primary);
  preview.style.setProperty('--secondary',theme.secondary);
  preview.style.setProperty('--accent',theme.accent);
  preview.style.setProperty('--background',theme.background);
  preview.style.setProperty('--surface',theme.surface);
  preview.style.setProperty('--text',theme.text);
  preview.style.setProperty('--text-muted',theme.textMuted);
  preview.style.setProperty('--border',theme.border);
  preview.style.setProperty('--radius',theme.radius+'px');
  preview.style.background=theme.surface;
  preview.style.color=theme.text;
  preview.style.borderRadius=theme.radius+'px';
  preview.querySelectorAll('.theme-card, .demo-btn').forEach(el=>{
    el.style.setProperty('--btn-bg','var(--primary)');
    el.style.setProperty('--btn-color','#fff');
    if(el.matches('.demo-btn')){el.style.background='var(--btn-bg)';el.style.color='var(--btn-color)';el.style.borderRadius=theme.radius+'px'}
  });
  preview.querySelectorAll('input').forEach(el=>{el.style.background=adjustBrightness(theme.surface,10);el.style.borderColor=theme.border;el.style.color=theme.text;el.style.borderRadius=theme.radius+'px'});
  // Sync picker values
  document.getElementById('primary').value=theme.primary;
  document.getElementById('secondary').value=theme.secondary;
  document.getElementById('accent').value=theme.accent;
  document.getElementById('background').value=theme.background;
  document.getElementById('surface').value=theme.surface;
  document.getElementById('text').value=theme.text;
  document.getElementById('textMuted').value=theme.textMuted;
  document.getElementById('border').value=theme.border;
  updateCSS();
  updatePalette();
}

function adjustBrightness(hex,amt){if(hex.startsWith('rgba')||hex.startsWith('#')){try{let r,g,b;if(hex.startsWith('#')){r=parseInt(hex.slice(1,3),16);g=parseInt(hex.slice(3,5),16);b=parseInt(hex.slice(5,7),16)}else{const m=hex.match(/[\d.]+/g);r=parseFloat(m[0]);g=parseFloat(m[1]);b=parseFloat(m[2])}
  r=Math.min(255,Math.max(0,r+amt));g=Math.min(255,Math.max(0,g+amt));b=Math.min(255,Math.max(0,b+amt));return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`}catch(e){}}
  return hex}

function updateCSS(){
  const css=`/* Theme Variables */
:root {
  --primary: ${theme.primary};
  --secondary: ${theme.secondary};
  --accent: ${theme.accent};
  --background: ${theme.background};
  --surface: ${theme.surface};
  --text: ${theme.text};
  --text-muted: ${theme.textMuted};
  --border: ${theme.border};
  --radius: ${theme.radius}px;
}

/* Usage */
body {
  background: var(--background);
  color: var(--text);
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.btn-primary {
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius);
}`;
  document.getElementById('cssOutput').textContent=css;
}

function updatePalette(){
  const grid=document.getElementById('paletteGrid');
  const colors=[theme.primary,theme.secondary,theme.accent,theme.background,theme.surface,theme.text,
    theme.textMuted,...generateShades(theme.primary,5),...generateShades(theme.secondary,3),...generateShades(theme.accent,3)];
  grid.innerHTML=colors.map(c=>`<div class="swatch" style="background:${c}" title="${c}"></div>`).join('');
}

function generateShades(hex,count){const shades=[];try{for(let i=1;i<=count;i++){const t=i/(count+1);shades.push(lerpColor(hex,'#fff',t))}}catch(e){};return shades}
function lerpColor(c1,c2,t){try{const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`}catch(e){return c1}}

function loadPreset(name){
  const presets={
    dark:{primary:'#00d9ff',secondary:'#4ade80',accent:'#c084fc',background:'#0a0a14',surface:'#1a1a2e',text:'#e0e0e0',textMuted:'#555',border:'rgba(255,255,255,0.08)'},
    light:{primary:'#2563eb',secondary:'#16a34a',accent:'#9333ea',background:'#f8fafc',surface:'#ffffff',text:'#1e293b',textMuted:'#94a3b8',border:'rgba(0,0,0,0.1)'},
    ocean:{primary:'#06b6d4',secondary:'#10b981',accent:'#6366f1',background:'#0f172a',surface:'#1e293b',text:'#e2e8f0',textMuted:'#64748b',border:'rgba(255,255,255,0.06)'},
    sunset:{primary:'#f59e0b',secondary:'#f97316',accent:'#ef4444',background:'#1c1917',surface:'#292524',text:'#fafaf9',textMuted:'#a8a29e',border:'rgba(255,255,255,0.08)'},
    forest:{primary:'#22c55e',secondary:'#15803d',accent:'#65a30d',background:'#052e16',surface:'#0f3d1a',text:'#dcfce7',textMuted:'#4a7c59',border:'rgba(255,255,255,0.06)'},
    neon:{primary:'#a855f7',secondary:'#ec4899',accent:'#22d3ee',background:'#0a0014',surface:'#1a0028',text:'#f0e6ff',textMuted:'#7c4d9e',border:'rgba(168,85,247,0.15)'}
  };
  const p=presets[name];if(!p)return;
  Object.assign(theme,p);
  applyTheme();
  saveToStorage();
}

function resetTheme(){loadPreset('dark')}
function exportCSS(){navigator.clipboard.writeText(document.getElementById('cssOutput').textContent).then(()=>showToast('CSS copied!'))}
function showToast(m){const t=document.createElement('div');t.textContent=m;Object.assign(t.style,{position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',background:'rgba(0,217,255,0.15)',color:'#00d9ff',padding:'6px 16px',borderRadius:'4px',fontSize:'0.55rem',zIndex:999,transition:'opacity 0.2s',border:'1px solid rgba(0,217,255,0.2)'});document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000)}
function saveToStorage(){try{localStorage.setItem('theme_data',JSON.stringify(theme))}catch(e){}}
function loadFromStorage(){try{const d=JSON.parse(localStorage.getItem('theme_data'));if(d){Object.assign(theme,d);return true}}catch(e){}return false}
if(!loadFromStorage())loadPreset('dark');else applyTheme();
</script></body></html>
