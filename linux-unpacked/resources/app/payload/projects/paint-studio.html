<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint Studio Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a14;color:#ccc;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;padding:6px 12px;background:#12121e;border-bottom:1px solid rgba(255,255,255,0.06);gap:8px}
header h1{font-size:0.9rem;color:#00d9ff}
header h1 small{color:#555;font-size:0.6rem;font-weight:400}
.toolbar{display:flex;gap:3px;flex-wrap:wrap}
.toolbar button,.toolbar .tool-btn{
  padding:4px 8px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;
  background:rgba(255,255,255,0.03);color:#888;cursor:pointer;font-size:0.6rem;
  font-family:inherit;transition:0.1s;line-height:1
}
.toolbar button:hover,.toolbar .tool-btn:hover{border-color:#00d9ff;color:#ccc}
.toolbar .tool-btn.active{border-color:#00d9ff;color:#00d9ff;background:rgba(0,217,255,0.1)}
.toolbar .sep{width:1px;background:rgba(255,255,255,0.08);margin:0 3px}
.main{display:flex;flex:1;overflow:hidden}
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#080810;position:relative;overflow:hidden}
#paintCanvas{cursor:crosshair;image-rendering:pixelated}
.sidebar{
  width:220px;background:#12121e;border-left:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;font-size:0.65rem
}
.sidebar-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.06)}
.sidebar-tab{
  flex:1;padding:6px;text-align:center;cursor:pointer;color:#555;
  border-bottom:2px solid transparent;transition:0.1s;font-size:0.6rem
}
.sidebar-tab:hover{color:#888}
.sidebar-tab.active{color:#00d9ff;border-bottom-color:#00d9ff}
.sidebar-content{flex:1;overflow-y:auto;padding:8px}
.layers-list{display:flex;flex-direction:column;gap:2px}
.layer-item{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:3px;cursor:pointer;border:1px solid transparent;font-size:0.6rem}
.layer-item:hover{background:rgba(255,255,255,0.03)}
.layer-item.active{border-color:rgba(0,217,255,0.3);background:rgba(0,217,255,0.05)}
.layer-item .thumb{width:28px;height:28px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,0.05)}
.layer-item .lname{flex:1;color:#aaa}
.layer-item .vis{cursor:pointer;color:#555;font-size:0.55rem}
.color-picker{display:flex;gap:3px;margin-bottom:6px}
.color-picker input[type=color]{width:28px;height:28px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;cursor:pointer;background:transparent;padding:0}
.size-picker{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.size-picker label{color:#666;min-width:30px;font-size:0.55rem}
.size-picker input[type=range]{flex:1;accent-color:#00d9ff}
.size-picker .val{color:#00d9ff;min-width:20px;text-align:right;font-size:0.55rem}
.blend-select{width:100%;padding:4px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);border-radius:3px;color:#888;font-family:inherit;font-size:0.55rem;margin-bottom:6px;outline:none}
.blend-select:focus{border-color:#00d9ff}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.filter-grid button{padding:4px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;background:rgba(255,255,255,0.03);color:#888;cursor:pointer;font-size:0.55rem;font-family:inherit;transition:0.1s}
.filter-grid button:hover{border-color:#00d9ff;color:#ccc}
.status{font-size:0.55rem;color:#444;padding:3px 8px;border-top:1px solid rgba(255,255,255,0.04)}
</style>
</head>
<body>
<header>
  <h1>🎨 Paint Studio <small>Layers · Filters · Brushes</small></h1>
  <div class="toolbar">
    <button class="tool-btn active" data-tool="brush" onclick="setTool('brush')">🖊 Brush</button>
    <button class="tool-btn" data-tool="eraser" onclick="setTool('eraser')">🧹 Eraser</button>
    <button class="tool-btn" data-tool="fill" onclick="setTool('fill')">🪣 Fill</button>
    <button class="tool-btn" data-tool="picker" onclick="setTool('picker')">💉 Pick</button>
    <span class="sep"></span>
    <button onclick="undo()">↩ Undo</button>
    <button onclick="redo()">↪ Redo</button>
    <span class="sep"></span>
    <button onclick="exportPNG()">💾 Export</button>
    <button onclick="clearCanvas()">✕ Clear</button>
  </div>
</header>
<div class="main">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="paintCanvas" width="800" height="600"></canvas>
  </div>
  <div class="sidebar">
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" data-tab="layers" onclick="switchTab('layers')">📑 Layers</div>
      <div class="sidebar-tab" data-tab="filters" onclick="switchTab('filters')">🎛️ Filters</div>
    </div>
    <div class="sidebar-content" id="layersTab">
      <div style="display:flex;gap:3px;margin-bottom:6px">
        <button onclick="addLayer()" style="flex:1;padding:4px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;background:rgba(255,255,255,0.03);color:#888;cursor:pointer;font-size:0.55rem;font-family:inherit">➕ Add</button>
        <button onclick="duplicateLayer()" style="flex:1;padding:4px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;background:rgba(255,255,255,0.03);color:#888;cursor:pointer;font-size:0.55rem;font-family:inherit">📋 Dup</button>
        <button onclick="mergeLayer()" style="flex:1;padding:4px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;background:rgba(255,255,255,0.03);color:#888;cursor:pointer;font-size:0.55rem;font-family:inherit">⬇ Merge</button>
        <button onclick="deleteLayer()" style="flex:1;padding:4px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;background:rgba(255,255,255,0.03);color:#f87171;cursor:pointer;font-size:0.55rem;font-family:inherit">🗑</button>
      </div>
      <div class="layers-list" id="layersList"></div>
      
      <div style="margin-top:12px">
        <div class="color-picker">
          <input type="color" id="primaryColor" value="#00d9ff" onchange="updateColors()">
          <input type="color" id="secondaryColor" value="#ffffff" onchange="updateColors()">
          <button onclick="swapColors()" style="padding:2px 6px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;background:rgba(255,255,255,0.03);color:#888;cursor:pointer;font-size:0.6rem">⇄</button>
        </div>
        <div class="size-picker">
          <label>Size</label>
          <input type="range" min="1" max="50" value="8" id="brushSize" oninput="updateBrushSize()">
          <span class="val" id="brushSizeVal">8</span>
        </div>
        <div class="size-picker">
          <label>Opacity</label>
          <input type="range" min="0" max="100" value="100" id="brushOpacity" oninput="updateBrushOpacity()">
          <span class="val" id="brushOpacityVal">100</span>
        </div>
        <select class="blend-select" id="blendMode" onchange="updateBlendMode()">
          <option value="source-over">Normal</option>
          <option value="multiply">Multiply</option>
          <option value="screen">Screen</option>
          <option value="overlay">Overlay</option>
          <option value="darken">Darken</option>
          <option value="lighten">Lighten</option>
          <option value="color-dodge">Color Dodge</option>
          <option value="color-burn">Color Burn</option>
          <option value="difference">Difference</option>
          <option value="exclusion">Exclusion</option>
          <option value="hue">Hue</option>
          <option value="saturation">Saturation</option>
          <option value="color">Color</option>
          <option value="luminosity">Luminosity</option>
        </select>
      </div>
    </div>
    <div class="sidebar-content" id="filtersTab" style="display:none">
      <div class="filter-grid">
        <button onclick="applyFilter('grayscale')">⚫ Grayscale</button>
        <button onclick="applyFilter('sepia')">🟫 Sepia</button>
        <button onclick="applyFilter('invert')">🔄 Invert</button>
        <button onclick="applyFilter('blur')">🌫 Blur</button>
        <button onclick="applyFilter('sharpen')">✨ Sharpen</button>
        <button onclick="applyFilter('emboss')">🗻 Emboss</button>
        <button onclick="applyFilter('edge-detect')">🔍 Edges</button>
        <button onclick="applyFilter('pixelate')">🔲 Pixelate</button>
        <button onclick="applyFilter('posterize')">🎨 Posterize</button>
        <button onclick="applyFilter('solarize')">☀ Solarize</button>
        <button onclick="applyFilter('noise')">📺 Noise</button>
        <button onclick="applyFilter('oil')">🖌 Oil Paint</button>
      </div>
      <div style="margin-top:10px">
        <label style="color:#555;font-size:0.55rem">Adjustment Sliders</label>
        <div><label style="color:#666">Brightness</label><input type="range" min="-100" max="100" value="0" id="adjBrightness" style="width:100%;accent-color:#00d9ff" oninput="applyAdjustments()"></div>
        <div><label style="color:#666">Contrast</label><input type="range" min="-100" max="100" value="0" id="adjContrast" style="width:100%;accent-color:#00d9ff" oninput="applyAdjustments()"></div>
        <div><label style="color:#666">Saturation</label><input type="range" min="-100" max="100" value="0" id="adjSaturation" style="width:100%;accent-color:#00d9ff" oninput="applyAdjustments()"></div>
        <button onclick="resetAdjustments()" style="width:100%;margin-top:6px;padding:4px;border:1px solid rgba(255,255,255,0.06);border-radius:3px;background:rgba(255,255,255,0.03);color:#888;cursor:pointer;font-size:0.55rem;font-family:inherit">Reset</button>
      </div>
    </div>
    <div class="status" id="statusBar">Brush · Size: 8 · Opacity: 100%</div>
  </div>
</div>

<script>
// ── STATE ──
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');

let layers = [];
let activeLayerIndex = 0;
let currentTool = 'brush';
let primaryColor = '#00d9ff';
let secondaryColor = '#ffffff';
let brushSize = 8;
let brushOpacity = 1;
let blendMode = 'source-over';
let isDrawing = false;
let lastX = 0, lastY = 0;
let undoStack = [];
let redoStack = [];
let dirty = false;

// ── LAYERS ──
function createLayer(name, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { canvas: c, ctx: c.getContext('2d'), name, visible: true, opacity: 1, blendMode: 'source-over' };
}

function initCanvas() {
  const w = 800, h = 600;
  canvas.width = w; canvas.height = h;
  
  // Background layer
  const bg = createLayer('Background', w, h);
  bg.ctx.fillStyle = '#ffffff';
  bg.ctx.fillRect(0, 0, w, h);
  layers.push(bg);
  
  // Drawing layer
  const draw = createLayer('Layer 1', w, h);
  layers.push(draw);
  
  activeLayerIndex = 1;
  renderComposite();
  renderLayers();
}

function getActiveLayer() { return layers[activeLayerIndex]; }

function addLayer() {
  const name = `Layer ${layers.length}`;
  const l = createLayer(name, canvas.width, canvas.height);
  layers.push(l);
  activeLayerIndex = layers.length - 1;
  renderLayers();
  renderComposite();
}

function duplicateLayer() {
  const src = getActiveLayer();
  if (!src) return;
  const c = createLayer(src.name + ' copy', canvas.width, canvas.height);
  c.ctx.drawImage(src.canvas, 0, 0);
  layers.splice(activeLayerIndex + 1, 0, c);
  activeLayerIndex++;
  renderLayers();
  renderComposite();
}

function mergeLayer() {
  if (layers.length < 2 || activeLayerIndex < 1) return;
  const src = layers[activeLayerIndex];
  const dst = layers[activeLayerIndex - 1];
  dst.ctx.drawImage(src.canvas, 0, 0);
  layers.splice(activeLayerIndex, 1);
  activeLayerIndex--;
  renderLayers();
  renderComposite();
}

function deleteLayer() {
  if (layers.length <= 1) return;
  layers.splice(activeLayerIndex, 1);
  activeLayerIndex = Math.min(activeLayerIndex, layers.length - 1);
  renderLayers();
  renderComposite();
}

function toggleLayerVisibility(idx) {
  layers[idx].visible = !layers[idx].visible;
  renderLayers();
  renderComposite();
}

function selectLayer(idx) {
  activeLayerIndex = idx;
  renderLayers();
}

function updateLayerOpacity(idx, val) {
  layers[idx].opacity = parseFloat(val);
  renderComposite();
}

// ── COMPOSITE ──
function renderComposite() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const layer of layers) {
    if (!layer.visible) continue;
    ctx.globalAlpha = layer.opacity;
    ctx.globalCompositeOperation = layer.blendMode || 'source-over';
    ctx.drawImage(layer.canvas, 0, 0);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function renderLayers() {
  const list = document.getElementById('layersList');
  list.innerHTML = '';
  for (let i = layers.length - 1; i >= 0; i--) {
    const l = layers[i];
    const div = document.createElement('div');
    div.className = 'layer-item' + (i === activeLayerIndex ? ' active' : '');
    div.innerHTML = `
      <span class="vis" onclick="event.stopPropagation();toggleLayerVisibility(${i})">${l.visible ? '👁' : '🚫'}</span>
      <span class="thumb" style="background-image:url(${l.canvas.toDataURL()});background-size:cover"></span>
      <span class="lname">${l.name}</span>
      <input type="range" min="0" max="1" step="0.1" value="${l.opacity}" onmousedown="event.stopPropagation()" oninput="updateLayerOpacity(${i},this.value)" style="width:40px;accent-color:#00d9ff">
    `;
    div.onclick = () => selectLayer(i);
    list.appendChild(div);
  }
}

// ── DRAWING ──
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function startDraw(e) {
  e.preventDefault();
  if (currentTool === 'fill') { handleFill(e); return; }
  if (currentTool === 'picker') { handlePick(e); return; }
  
  isDrawing = true;
  saveState();
  const pos = getCanvasPos(e);
  lastX = pos.x; lastY = pos.y;
  
  const layer = getActiveLayer();
  if (!layer) return;
  const lctx = layer.ctx;
  lctx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : blendMode;
  lctx.globalAlpha = brushOpacity;
  lctx.beginPath();
  lctx.arc(lastX, lastY, brushSize / 2, 0, Math.PI * 2);
  lctx.fillStyle = primaryColor;
  lctx.fill();
}

function draw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  const layer = getActiveLayer();
  if (!layer) return;
  const lctx = layer.ctx;
  
  lctx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : blendMode;
  lctx.globalAlpha = brushOpacity;
  lctx.beginPath();
  lctx.moveTo(lastX, lastY);
  lctx.lineTo(pos.x, pos.y);
  lctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : primaryColor;
  lctx.lineWidth = brushSize;
  lctx.lineCap = 'round';
  lctx.lineJoin = 'round';
  lctx.stroke();
  
  lastX = pos.x; lastY = pos.y;
  renderComposite();
  dirty = true;
}

function endDraw(e) {
  if (!isDrawing) return;
  isDrawing = false;
  renderLayers();
}

function handleFill(e) {
  const pos = getCanvasPos(e);
  const layer = getActiveLayer();
  if (!layer) return;
  const lctx = layer.ctx;
  const imgData = lctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  
  const px = Math.floor(pos.x);
  const py = Math.floor(pos.y);
  const idx = (py * canvas.width + px) * 4;
  const targetColor = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
  
  if (targetColor[0] === parseInt(primaryColor.slice(1,3),16) && 
      targetColor[1] === parseInt(primaryColor.slice(3,5),16) && 
      targetColor[2] === parseInt(primaryColor.slice(5,7),16)) return;
  
  const fillR = parseInt(primaryColor.slice(1,3),16);
  const fillG = parseInt(primaryColor.slice(3,5),16);
  const fillB = parseInt(primaryColor.slice(5,7),16);
  
  // Flood fill using stack
  const visited = new Set();
  const stack = [[px, py]];
  const w = canvas.width;
  const h = canvas.height;
  
  while (stack.length > 0 && stack.length < 50000) {
    const [cx, cy] = stack.pop();
    const key = cx + ',' + cy;
    if (visited.has(key)) continue;
    if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
    
    const i = (cy * w + cx) * 4;
    if (Math.abs(data[i] - targetColor[0]) > 30 || Math.abs(data[i+1] - targetColor[1]) > 30 || 
        Math.abs(data[i+2] - targetColor[2]) > 30) continue;
    
    visited.add(key);
    data[i] = fillR; data[i+1] = fillG; data[i+2] = fillB; data[i+3] = 255;
    
    stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
  }
  
  lctx.putImageData(imgData, 0, 0);
  renderComposite();
  renderLayers();
}

function handlePick(e) {
  const pos = getCanvasPos(e);
  const px = Math.floor(pos.x);
  const py = Math.floor(pos.y);
  const imgData = ctx.getImageData(px, py, 1, 1).data;
  const hex = '#' + [imgData[0], imgData[1], imgData[2]].map(v => v.toString(16).padStart(2,'0')).join('');
  primaryColor = hex;
  document.getElementById('primaryColor').value = hex;
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);

// ── TOOLS ──
function setTool(tool) {
  currentTool = tool;
  canvas.style.cursor = tool === 'fill' ? 'cell' : tool === 'picker' ? 'crosshair' : 'crosshair';
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  updateStatus();
}

function updateColors() {
  primaryColor = document.getElementById('primaryColor').value;
  secondaryColor = document.getElementById('secondaryColor').value;
}

function swapColors() {
  const tmp = primaryColor;
  primaryColor = secondaryColor;
  secondaryColor = tmp;
  document.getElementById('primaryColor').value = primaryColor;
  document.getElementById('secondaryColor').value = secondaryColor;
}

function updateBrushSize() {
  brushSize = parseInt(document.getElementById('brushSize').value);
  document.getElementById('brushSizeVal').textContent = brushSize;
  updateStatus();
}

function updateBrushOpacity() {
  brushOpacity = parseInt(document.getElementById('brushOpacity').value) / 100;
  document.getElementById('brushOpacityVal').textContent = parseInt(document.getElementById('brushOpacity').value);
  updateStatus();
}

function updateBlendMode() {
  blendMode = document.getElementById('blendMode').value;
  updateStatus();
}

function updateStatus() {
  document.getElementById('statusBar').textContent = 
    `${currentTool.charAt(0).toUpperCase() + currentTool.slice(1)} · Size: ${brushSize} · Opacity: ${Math.round(brushOpacity * 100)}%`;
}

// ── UNDO / REDO ──
function saveState() {
  const data = layers.map(l => l.canvas.toDataURL());
  undoStack.push(data);
  redoStack = [];
  if (undoStack.length > 20) undoStack.shift();
}

function undo() {
  if (undoStack.length === 0) return;
  const current = layers.map(l => l.canvas.toDataURL());
  redoStack.push(current);
  const prev = undoStack.pop();
  restoreFromData(prev);
}

function redo() {
  if (redoStack.length === 0) return;
  const current = layers.map(l => l.canvas.toDataURL());
  undoStack.push(current);
  const next = redoStack.pop();
  restoreFromData(next);
}

function restoreFromData(data) {
  let loaded=0;const total=Math.min(data.length,layers.length);
  function loadNext(i){
    if(i>=total){renderComposite();renderLayers();return}
    const img=new Image();
    img.onload=()=>{layers[i].ctx.drawImage(img,0,0);loadNext(i+1)};
    img.onerror=()=>loadNext(i+1);
    img.src=data[i];
  }
  loadNext(0);
}

// ── FILTERS ──
function applyFilter(type) {
  saveState();
  const layer = getActiveLayer();
  if (!layer) return;
  const imgData = layer.ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const w = canvas.width, h = canvas.height;
  
  switch (type) {
    case 'grayscale':
      for (let i = 0; i < data.length; i += 4) {
        const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        data[i] = data[i+1] = data[i+2] = gray;
      }
      break;
    case 'sepia':
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
        data[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
        data[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
      }
      break;
    case 'invert':
      for (let i = 0; i < data.length; i += 4) {
        data[i] = 255 - data[i];
        data[i+1] = 255 - data[i+1];
        data[i+2] = 255 - data[i+2];
      }
      break;
    case 'blur': {
      const copy = new Uint8ClampedArray(data);
      const kernel = [1,2,1,2,4,2,1,2,1];
      const ksum = 16;
      for (let y = 1; y < h-1; y++) {
        for (let x = 1; x < w-1; x++) {
          let r=0,g=0,b=0;
          for (let ky=-1; ky<=1; ky++) {
            for (let kx=-1; kx<=1; kx++) {
              const idx = ((y+ky)*w + (x+kx)) * 4;
              const kidx = (ky+1)*3 + (kx+1);
              r += copy[idx] * kernel[kidx];
              g += copy[idx+1] * kernel[kidx];
              b += copy[idx+2] * kernel[kidx];
            }
          }
          const i = (y*w + x) * 4;
          data[i] = r/ksum; data[i+1] = g/ksum; data[i+2] = b/ksum;
        }
      }
      break;
    }
    case 'sharpen': {
      const copy = new Uint8ClampedArray(data);
      const kernel = [0,-1,0,-1,5,-1,0,-1,0];
      for (let y = 1; y < h-1; y++) {
        for (let x = 1; x < w-1; x++) {
          let r=0,g=0,b=0;
          for (let ky=-1; ky<=1; ky++) {
            for (let kx=-1; kx<=1; kx++) {
              const idx = ((y+ky)*w + (x+kx)) * 4;
              const kidx = (ky+1)*3 + (kx+1);
              r += copy[idx] * kernel[kidx];
              g += copy[idx+1] * kernel[kidx];
              b += copy[idx+2] * kernel[kidx];
            }
          }
          const i = (y*w + x) * 4;
          data[i] = Math.min(255, Math.max(0, r));
          data[i+1] = Math.min(255, Math.max(0, g));
          data[i+2] = Math.min(255, Math.max(0, b));
        }
      }
      break;
    }
    case 'emboss': {
      const copy = new Uint8ClampedArray(data);
      for (let y = 1; y < h-1; y++) {
        for (let x = 1; x < w-1; x++) {
          const idxNW = ((y-1)*w + (x-1))*4, idxSE = ((y+1)*w + (x+1))*4;
          const i = (y*w + x)*4;
          const r = copy[idxNW] - copy[idxSE] + 128;
          const g = copy[idxNW+1] - copy[idxSE+1] + 128;
          const b = copy[idxNW+2] - copy[idxSE+2] + 128;
          data[i] = Math.min(255, Math.max(0, r));
          data[i+1] = Math.min(255, Math.max(0, g));
          data[i+2] = Math.min(255, Math.max(0, b));
        }
      }
      break;
    }
    case 'edge-detect': {
      const copy = new Uint8ClampedArray(data);
      for (let y = 1; y < h-1; y++) {
        for (let x = 1; x < w-1; x++) {
          const idxNW = ((y-1)*w + (x-1))*4, idxN = ((y-1)*w + x)*4, idxNE = ((y-1)*w + x+1)*4;
          const idxW = (y*w + (x-1))*4, idxE = (y*w + x+1)*4;
          const idxSW = ((y+1)*w + (x-1))*4, idxS = ((y+1)*w + x)*4, idxSE = ((y+1)*w + x+1)*4;
          const i = (y*w + x)*4;
          const gx = -copy[idxNW] - 2*copy[idxW] - copy[idxSW] + copy[idxNE] + 2*copy[idxE] + copy[idxSE];
          const gy = -copy[idxNW] - 2*copy[idxN] - copy[idxNE] + copy[idxSW] + 2*copy[idxS] + copy[idxSE];
          const val = Math.min(255, Math.sqrt(gx*gx + gy*gy));
          data[i] = data[i+1] = data[i+2] = val;
        }
      }
      break;
    }
    case 'pixelate': {
      const size = 8;
      for (let y = 0; y < h; y += size) {
        for (let x = 0; x < w; x += size) {
          let r=0,g=0,b=0,count=0;
          for (let py=0; py<size && y+py<h; py++) {
            for (let px=0; px<size && x+px<w; px++) {
              const idx = ((y+py)*w + (x+px))*4;
              r += data[idx]; g += data[idx+1]; b += data[idx+2]; count++;
            }
          }
          r/=count; g/=count; b/=count;
          for (let py=0; py<size && y+py<h; py++) {
            for (let px=0; px<size && x+px<w; px++) {
              const idx = ((y+py)*w + (x+px))*4;
              data[idx]=r; data[idx+1]=g; data[idx+2]=b;
            }
          }
        }
      }
      break;
    }
    case 'posterize':
      for (let i = 0; i < data.length; i += 4) {
        const levels = 4;
        data[i] = Math.round(data[i] / 255 * levels) * (255 / levels);
        data[i+1] = Math.round(data[i+1] / 255 * levels) * (255 / levels);
        data[i+2] = Math.round(data[i+2] / 255 * levels) * (255 / levels);
      }
      break;
    case 'solarize':
      for (let i = 0; i < data.length; i += 4) {
        data[i] = data[i] > 128 ? 255 - data[i] : data[i];
        data[i+1] = data[i+1] > 128 ? 255 - data[i+1] : data[i+1];
        data[i+2] = data[i+2] > 128 ? 255 - data[i+2] : data[i+2];
      }
      break;
    case 'noise':
      for (let i = 0; i < data.length; i += 4) {
        const noise = Math.random() * 60 - 30;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
      }
      break;
    case 'oil': {
      const copy = new Uint8ClampedArray(data);
      const rad = 3;
      for (let y = rad; y < h-rad; y++) {
        for (let x = rad; x < w-rad; x++) {
          const bins = Array(256).fill(null).map(() => ({r:0,g:0,b:0,count:0}));
          for (let ky=-rad; ky<=rad; ky++) {
            for (let kx=-rad; kx<=rad; kx++) {
              const idx = ((y+ky)*w + (x+kx))*4;
              const gray = Math.round(0.299*copy[idx] + 0.587*copy[idx+1] + 0.114*copy[idx+2]);
              bins[gray].r += copy[idx];
              bins[gray].g += copy[idx+1];
              bins[gray].b += copy[idx+2];
              bins[gray].count++;
            }
          }
          let maxBin = 0, maxCount = 0;
          for (let i = 0; i < bins.length; i++) {
            if (bins[i].count > maxCount) { maxCount = bins[i].count; maxBin = i; }
          }
          const idx = (y*w + x)*4;
          data[idx] = bins[maxBin].r / maxCount;
          data[idx+1] = bins[maxBin].g / maxCount;
          data[idx+2] = bins[maxBin].b / maxCount;
        }
      }
      break;
    }
  }
  
  layer.ctx.putImageData(imgData, 0, 0);
  renderComposite();
  renderLayers();
}

function applyAdjustments() {
  const b = parseInt(document.getElementById('adjBrightness').value);
  const c = parseInt(document.getElementById('adjContrast').value);
  const s = parseInt(document.getElementById('adjSaturation').value);
  if (b === 0 && c === 0 && s === 0) return;
  
  const layer = getActiveLayer();
  if (!layer) return;
  const imgData = layer.ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  
  const contrast = (100 + c) / 100;
  const brightness = b;
  const sat = (100 + s) / 100;
  
  for (let i = 0; i < data.length; i += 4) {
    let r = data[i] + brightness;
    let g = data[i+1] + brightness;
    let b = data[i+2] + brightness;
    
    r = (r - 128) * contrast + 128;
    g = (g - 128) * contrast + 128;
    b = (b - 128) * contrast + 128;
    
    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    r = gray + (r - gray) * sat;
    g = gray + (g - gray) * sat;
    b = gray + (b - gray) * sat;
    
    data[i] = Math.min(255, Math.max(0, r));
    data[i+1] = Math.min(255, Math.max(0, g));
    data[i+2] = Math.min(255, Math.max(0, b));
  }
  
  layer.ctx.putImageData(imgData, 0, 0);
  renderComposite();
}

function resetAdjustments() {
  document.getElementById('adjBrightness').value = 0;
  document.getElementById('adjContrast').value = 0;
  document.getElementById('adjSaturation').value = 0;
  renderComposite();
}

// ── TAB ──
function switchTab(tab) {
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('layersTab').style.display = tab === 'layers' ? 'block' : 'none';
  document.getElementById('filtersTab').style.display = tab === 'filters' ? 'block' : 'none';
}

// ── EXPORT ──
function exportPNG() {
  const link = document.createElement('a');
  link.download = 'painting.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function clearCanvas() {
  if (!confirm('Clear all layers?')) return;
  layers.forEach(l => {
    l.ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
  renderComposite();
  renderLayers();
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'Z') { e.preventDefault(); redo(); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); exportPNG(); }
  if (e.key === 'b') setTool('brush');
  if (e.key === 'e') setTool('eraser');
  if (e.key === 'g') setTool('fill');
  if (e.key === 'i') setTool('picker');
  if (e.key === '[') brushSize = Math.max(1, brushSize - 2), document.getElementById('brushSize').value = brushSize, updateBrushSize();
  if (e.key === ']') brushSize = Math.min(50, brushSize + 2), document.getElementById('brushSize').value = brushSize, updateBrushSize();
});

// ── INIT ──
initCanvas();
updateStatus();
</script>
