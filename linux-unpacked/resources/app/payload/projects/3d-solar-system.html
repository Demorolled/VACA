<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🪐 3D Solar System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; font-family: 'Segoe UI', system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: rgba(10, 14, 28, 0.8); border: 1px solid rgba(90, 130, 255, 0.25);
    border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); color: #dfe7ff; font-size: 14px; user-select: none;
  }
  #hud button {
    background: rgba(70, 110, 255, 0.18); color: #c9d8ff; border: 1px solid rgba(120,160,255,0.35);
    border-radius: 8px; padding: 5px 11px; font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  #hud button:hover { background: rgba(70,110,255,0.35); color: #fff; transform: translateY(-1px); }
  #planetInfo {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(10, 14, 28, 0.85); border: 1px solid rgba(90, 130, 255, 0.25);
    border-radius: 10px; padding: 10px 18px; color: #cfe0ff; font-size: 13px; text-align: center;
    min-width: 260px; backdrop-filter: blur(8px); transition: opacity 0.2s;
  }
  #hint { position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(160,180,220,0.5); font-size: 12px; }
  #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    color: #ff9c9c; font-size: 16px; padding: 24px; text-align: center; z-index: 20; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="scene"></div>
<div id="fallback">3D unavailable — could not load Three.js (CDN blocked or offline).</div>
<div id="hud">
  <span>🪐 Solar System</span>
  <button id="speedBtn">Speed: 1×</button>
  <button id="toggleBtn">Orbits: On</button>
</div>
<div id="hint">Drag to orbit · Scroll to zoom · Click a planet for details</div>
<div id="planetInfo"></div>

<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') { document.getElementById('fallback').style.display = 'flex'; return; }

  // ── Scene / camera / renderer ───────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05060f);
  scene.fog = new THREE.Fog(0x05060f, 60, 140);

  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
  camera.position.set(0, 24, 44);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('scene').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 8;
  controls.maxDistance = 120;
  controls.target.set(0, 0, 0);

  // ── Lights ──────────────────────────────────────────────────────────────
  const ambient = new THREE.AmbientLight(0x223355, 0.6);
  scene.add(ambient);
  const sunLight = new THREE.PointLight(0xffdd99, 2.0, 200);
  sunLight.position.set(0, 0, 0);
  scene.add(sunLight);
  const rim = new THREE.DirectionalLight(0x4466ff, 0.35);
  rim.position.set(-30, 20, -20);
  scene.add(rim);

  // ── Starfield ───────────────────────────────────────────────────────────
  (function stars() {
    const n = 2500, pos = new Float32Array(n * 3);
    for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 260;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      color: 0xffffff, size: 0.22, transparent: true, opacity: 0.85, fog: false,
    })));
  })();

  // ── The Sun ─────────────────────────────────────────────────────────────
  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(2.4, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0xffcc66 })
  );
  scene.add(sun);
  const sunGlow = new THREE.Mesh(
    new THREE.SphereGeometry(3.1, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffaa44, transparent: true, opacity: 0.18 })
  );
  scene.add(sunGlow);

  // ── Planets ─────────────────────────────────────────────────────────────
  const PLANETS = [
    { name: 'Mercury', radius: 0.42, dist: 5.2, speed: 1.6, color: 0x9c8f84 },
    { name: 'Venus',   radius: 0.6,  dist: 7.4, speed: 1.17, color: 0xd9a05b },
    { name: 'Earth',   radius: 0.64, dist: 9.9, speed: 1.0, color: 0x3f7fd4 },
    { name: 'Mars',    radius: 0.5,  dist: 12.4, speed: 0.8, color: 0xc05b3f },
    { name: 'Jupiter', radius: 1.5,  dist: 16.4, speed: 0.44, color: 0xc89b6a },
    { name: 'Saturn',  radius: 1.25, dist: 20.4, speed: 0.33, color: 0xd8c39a, ring: true },
    { name: 'Uranus',  radius: 1.0,  dist: 24.4, speed: 0.23, color: 0x7fd4c8 },
    { name: 'Neptune', radius: 0.95, dist: 28.0, speed: 0.18, color: 0x4a66d4 },
  ];
  const planetGroups = [];
  const orbitLines = [];
  const FACTS = {
    Mercury: 'Closest to the Sun · 59 Earth days = 1 day · no moons',
    Venus:   'Hottest planet (465°C) · rotates backwards · 1 day > 1 year',
    Earth:   'Our home · 71% water · one large moon · liquid water',
    Mars:    'The Red Planet · Olympus Mons (tallest volcano) · 2 moons',
    Jupiter: 'Largest planet · Great Red Spot · 95 moons · gas giant',
    Saturn:  'Famous rings of ice & rock · 146 moons · least dense planet',
    Uranus:  'Rotates on its side · ice giant · 27 moons · pale cyan',
    Neptune: 'Windiest planet (2,100 km/h) · deep blue · 14 moons',
  };

  function orbitLine(dist) {
    const pts = [];
    for (let i = 0; i <= 128; i++) {
      const a = (i / 128) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x334488, transparent: true, opacity: 0.35 }));
    scene.add(line);
    return line;
  }

  PLANETS.forEach((p, i) => {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: p.color, metalness: 0.25, roughness: 0.7 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(p.radius, 40, 40), mat);
    body.castShadow = true;
    group.add(body);
    if (p.ring) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(p.radius * 1.4, p.radius * 2.2, 64),
        new THREE.MeshStandardMaterial({ color: 0xcbb07a, metalness: 0.4, roughness: 0.6, side: THREE.DoubleSide })
      );
      ring.rotation.x = Math.PI / 2.4;
      group.add(ring);
    }
    group.userData = { name: p.name, angle: Math.random() * Math.PI * 2, speed: p.speed, dist: p.dist };
    group.position.set(Math.cos(group.userData.angle) * p.dist, 0, Math.sin(group.userData.angle) * p.dist);
    scene.add(group);
    planetGroups.push(group);
    orbitLines.push(orbitLine(p.dist));
  });

  // ── Raycaster picking (click a planet → info) ───────────────────────────
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const infoEl = document.getElementById('planetInfo');
  let hovered = null;

  renderer.domElement.addEventListener('pointerdown', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    for (const g of planetGroups) {
      const hit = raycaster.intersectObjects(g.children, true)[0];
      if (hit) {
        const name = g.userData.name;
        infoEl.innerHTML = `<b style="color:#ffd27a">${name}</b><br>${FACTS[name] || ''}`;
        return;
      }
    }
    infoEl.innerHTML = '';
  });

  // ── Controls ────────────────────────────────────────────────────────────
  let speed = 1;
  let showOrbits = true;
  document.getElementById('speedBtn').addEventListener('click', () => {
    speed = speed === 1 ? 3 : speed === 3 ? 8 : 1;
    document.getElementById('speedBtn').textContent = 'Speed: ' + speed + '×';
  });
  document.getElementById('toggleBtn').addEventListener('click', () => {
    showOrbits = !showOrbits;
    orbitLines.forEach(l => { l.visible = showOrbits; });
    document.getElementById('toggleBtn').textContent = 'Orbits: ' + (showOrbits ? 'On' : 'Off');
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ── Animation loop ──────────────────────────────────────────────────────
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;
    sun.rotation.y += 0.002;
    sunGlow.scale.setScalar(1 + Math.sin(t * 2) * 0.04);
    planetGroups.forEach(g => {
      g.userData.angle += g.userData.speed * 0.004 * speed;
      const a = g.userData.angle;
      g.position.set(Math.cos(a) * g.userData.dist, 0, Math.sin(a) * g.userData.dist);
      g.rotation.y += 0.01 * speed;
    });
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // ── Test/automation hook ────────────────────────────────────────────────
  window.__vaca3d = {
    planetCount: planetGroups.length,
    state: function () {
      return {
        speed: speed,
        orbits: showOrbits,
        planets: planetGroups.map(g => ({ name: g.userData.name, angle: +g.userData.angle.toFixed(2) })),
      };
    },
  };
})();
</script>
</body>
</html>
