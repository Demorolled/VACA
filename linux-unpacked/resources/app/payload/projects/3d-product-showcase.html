<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✨ 3D Product Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: rgba(16, 18, 30, 0.8); border: 1px solid rgba(255, 180, 90, 0.3);
    border-radius: 12px; padding: 10px 16px; backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5); color: #f0e6d8; font-size: 14px; user-select: none;
  }
  #hud button {
    background: rgba(255, 170, 70, 0.16); color: #ffd9a8; border: 1px solid rgba(255,180,90,0.4);
    border-radius: 8px; padding: 5px 11px; font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  #hud button:hover { background: rgba(255,170,70,0.35); color: #fff; transform: translateY(-1px); }
  #hud button.active { background: rgba(255,170,70,0.45); color: #fff; }
  #productName {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: #ffd9a8; font-size: 22px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: rgba(200, 200, 220, 0.5); font-size: 12.5px; }
  #fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    color: #ff9c9c; font-size: 16px; padding: 24px; text-align: center; z-index: 20; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="scene"></div>
<div id="fallback">3D unavailable — could not load Three.js (CDN blocked or offline).</div>
<div id="hud">
  <span>✨ Showcase</span>
  <button data-p="bottle" class="active">Bottle</button>
  <button data-p="sphere">Globe</button>
  <button data-p="cube">Cube</button>
  <button id="spinBtn">Auto-rotate: On</button>
</div>
<div id="productName">Aurora Bottle</div>
<div id="hint">Drag to orbit · Scroll to zoom · Switch products above</div>

<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') { document.getElementById('fallback').style.display = 'flex'; return; }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 22, 55);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(5.5, 3.6, 6.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById('scene').appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 3;
  controls.maxDistance = 14;
  controls.target.set(0, 1.4, 0);

  // ── Lights ──────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const spot = new THREE.SpotLight(0xffe0b0, 1.6, 30, Math.PI / 5, 0.4);
  spot.position.set(4, 7, 4);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  scene.add(spot);
  const key = new THREE.DirectionalLight(0xffffff, 0.7);
  key.position.set(-4, 3, -3);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x55aaff, 0.4);
  rim.position.set(2, 4, -5);
  scene.add(rim);

  // ── Floor with soft shadow disc ─────────────────────────────────────────
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(6, 64),
    new THREE.MeshStandardMaterial({ color: 0x14141f, metalness: 0.3, roughness: 0.55 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);

  // ── Starfield + floating particles ──────────────────────────────────────
  (function stars() {
    const n = 900, pos = new Float32Array(n * 3);
    for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 60;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.7, fog: false })));
  })();
  const floatParticles = [];
  (function floats() {
    for (let i = 0; i < 40; i++) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.03 + Math.random() * 0.04, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffc277, transparent: true, opacity: 0.8 })
      );
      m.position.set((Math.random() - 0.5) * 7, 0.3 + Math.random() * 4, (Math.random() - 0.5) * 7);
      m.userData = { baseY: m.position.y, ph: Math.random() * Math.PI * 2, spd: 0.5 + Math.random() };
      scene.add(m);
      floatParticles.push(m);
    }
  })();

  // ── Products (LatheGeometry bottle + sphere + cube) ─────────────────────
  const PRODUCTS = {
    bottle: { label: 'Aurora Bottle', build: () => {
      const g = new THREE.Group();
      const profile = [
        [0, 0], [0.45, 0], [0.5, 0.06], [0.36, 0.5], [0.28, 0.9], [0.24, 1.5],
        [0.28, 1.8], [0.24, 2.0], [0.24, 2.3], [0.12, 2.3], [0.12, 1.95], [0, 1.95],
      ].map(p => new THREE.Vector2(p[0], p[1]));
      const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 48),
        new THREE.MeshStandardMaterial({ color: 0x2b6fd4, metalness: 0.55, roughness: 0.25, transparent: true, opacity: 0.92 }));
      body.castShadow = true;
      g.add(body);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.25, 24),
        new THREE.MeshStandardMaterial({ color: 0xd4a017, metalness: 0.9, roughness: 0.3 }));
      cap.position.y = 2.42; cap.castShadow = true;
      g.add(cap);
      return g;
    }},
    sphere: { label: 'Crystal Globe', build: () => {
      const g = new THREE.Group();
      const globe = new THREE.Mesh(new THREE.SphereGeometry(1.05, 64, 64),
        new THREE.MeshStandardMaterial({ color: 0x88ccff, metalness: 0.15, roughness: 0.12, transparent: true, opacity: 0.9 }));
      globe.castShadow = true;
      g.add(globe);
      // simple continent blobs on a canvas texture
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#0a2f5c'; ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = '#3fae7a';
      [[40,60,50,35],[130,80,55,30],[80,150,45,40],[180,160,40,30],[60,200,35,25]].forEach(([x,y,w,h]) => ctx.fillRect(x, y, w, h));
      const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
      globe.material = new THREE.MeshStandardMaterial({ map: tex, metalness: 0.1, roughness: 0.2 });
      const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, 0.18, 32),
        new THREE.MeshStandardMaterial({ color: 0xd4a017, metalness: 0.9, roughness: 0.3 }));
      stand.position.y = -1.05; stand.castShadow = true;
      g.add(stand);
      return g;
    }},
    cube: { label: 'Quantum Cube', build: () => {
      const g = new THREE.Group();
      const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.6, 1.6, 1.6));
      const frame = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x66ddff }));
      const inner = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.05, 1.05),
        new THREE.MeshStandardMaterial({ color: 0x2a5f9e, metalness: 0.7, roughness: 0.25, transparent: true, opacity: 0.85 }));
      inner.castShadow = true;
      g.add(frame, inner);
      return g;
    }},
  };

  let current = null;
  function setProduct(key) {
    if (current) { scene.remove(current); }
    current = PRODUCTS[key].build();
    current.position.y = 1.35;
    scene.add(current);
    document.getElementById('productName').textContent = PRODUCTS[key].label;
    document.querySelectorAll('#hud button[data-p]').forEach(b => b.classList.toggle('active', b.dataset.p === key));
  }
  setProduct('bottle');
  document.querySelectorAll('#hud button[data-p]').forEach(b =>
    b.addEventListener('click', () => setProduct(b.dataset.p)));

  // ── Auto-rotate toggle ──────────────────────────────────────────────────
  let autoRotate = true;
  document.getElementById('spinBtn').addEventListener('click', () => {
    autoRotate = !autoRotate;
    document.getElementById('spinBtn').textContent = 'Auto-rotate: ' + (autoRotate ? 'On' : 'Off');
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ── Animation loop ──────────────────────────────────────────────────────
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;
    if (current) {
      if (autoRotate) current.rotation.y += 0.008;
      current.position.y = 1.35 + Math.sin(t * 1.2) * 0.06;
    }
    floatParticles.forEach(p => {
      p.position.y = p.userData.baseY + Math.sin(t * p.userData.spd + p.userData.ph) * 0.25;
    });
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // ── Test/automation hook ────────────────────────────────────────────────
  window.__vaca3d = {
    product: () => document.getElementById('productName').textContent,
    setProduct: setProduct,
    autoRotate: () => autoRotate,
  };
})();
</script>
</body>
</html>
