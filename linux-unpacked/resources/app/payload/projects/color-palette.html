<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Color Palette Generator</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a14;color:#ccc;min-height:100vh;padding:12px;display:flex;justify-content:center}.container{max-width:960px;width:100%}h1{color:#00d9ff;font-size:1rem;margin-bottom:2px;text-align:center}p.sub{color:#555;font-size:0.6rem;margin-bottom:8px;text-align:center}.flex{display:flex;gap:10px}.sidebar{width:220px;flex-shrink:0}.main{flex:1}.panel{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:6px;padding:8px;margin-bottom:6px}.panel-title{color:#888;font-size:0.5rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.prop-row{display:flex;align-items:center;gap:6px;margin:3px 0;flex-wrap:wrap}.prop-row label{font-size:0.45rem;color:#555;min-width:55px}.prop-row input[type=color]{width:36px;height:28px;border:none;border-radius:4px;cursor:pointer;padding:0;background:none}.prop-row input[type=color]::-webkit-color-swatch{border:1px solid rgba(255,255,255,0.1);border-radius:4px}.prop-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;outline:none}.prop-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#00d9ff;cursor:pointer}.prop-row select{flex:1;padding:3px 4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:3px;color:#888;font-size:0.45rem;font-family:inherit}.btn{padding:4px 10px;border:1px solid rgba(255,255,255,0.06);border-radius:4px;background:transparent;color:#888;cursor:pointer;font-size:0.5rem;font-family:inherit;transition:0.1s}.btn:hover{border-color:#00d9ff;color:#ccc}.btn.primary{background:rgba(0,217,255,0.08);border-color:rgba(0,217,255,0.2);color:#00d9ff}.preset-btn{padding:3px 8px;border:1px solid rgba(255,255,255,0.04);border-radius:3px;background:transparent;color:#666;cursor:pointer;font-size:0.45rem;font-family:inherit;margin:1px}.preset-btn:hover{border-color:#00d9ff;color:#ccc}.preset-btn.active{border-color:#00d9ff;color:#00d9ff;background:rgba(0,217,255,0.06)}.palette-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin:6px 0}.palette-item{aspect-ratio:1;border-radius:8px;border:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px;cursor:pointer;transition:0.15s;position:relative;min-height:90px}.palette-item:hover{transform:scale(1.04);z-index:2}.palette-item .hex{font-size:0.5rem;color:rgba(255,255,255,0.8);text-shadow:0 1px 3px rgba(0,0,0,0.5);background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:3px;backdrop-filter:blur(4px)}.palette-item .lock{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.3);border:none;color:rgba(255,255,255,0.6);font-size:0.5rem;cursor:pointer;border-radius:3px;padding:1px 4px;backdrop-filter:blur(2px)}.palette-item .lock.locked{color:#facc15}.saved-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:180px;overflow-y:auto}.saved-palette{padding:4px;border:1px solid rgba(255,255,255,0.04);border-radius:4px;cursor:pointer;transition:0.1s}.saved-palette:hover{border-color:#00d9ff}.saved-palette .mini-swatches{display:flex;gap:2px}.saved-palette .mini-swatch{flex:1;height:16px;border-radius:2px}.saved-palette .p-name{font-size:0.4rem;color:#555;margin-top:2px}.css-out{font-family:'Courier New',monospace;font-size:0.45rem;color:#666;padding:6px;background:rgba(255,255,255,0.02);border-radius:4px;max-height:100px;overflow:auto;white-space:pre-wrap}.val{color:#00d9ff;font-size:0.5rem;min-width:18px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:4px 0}.mode-btn{padding:4px 6px;border:1px solid rgba(255,255,255,0.04);border-radius:4px;background:transparent;color:#666;cursor:pointer;font-size:0.4rem;font-family:inherit;transition:0.1s;text-align:center}.mode-btn:hover{border-color:#00d9ff;color:#ccc}.mode-btn.active{border-color:#00d9ff;color:#00d9ff;background:rgba(0,217,255,0.06)}</style></head><body><div class="container">
<h1>🎨 Color Palette Generator</h1><p class="sub">Generate harmonious color palettes · Export as CSS variables</p>
<div class="flex">
<div class="sidebar">
<div class="panel"><div class="panel-title">Base Color</div>
<div class="prop-row"><label>Pick</label><input type="color" id="baseColor" value="#00d9ff" onchange="generatePalette()"></div>
<div class="prop-row"><label>Hue</label><input type="range" id="hueSlider" min="0" max="360" value="186" oninput="syncColor('hue',this.value)"><span class="val" id="hueVal">186°</span></div>
<div class="prop-row"><label>Sat</label><input type="range" id="satSlider" min="0" max="100" value="80" oninput="syncColor('sat',this.value)"><span class="val" id="satVal">80%</span></div>
<div class="prop-row"><label>Light</label><input type="range" id="lightSlider" min="0" max="100" value="50" oninput="syncColor('light',this.value)"><span class="val" id="lightVal">50%</span></div>
</div>
<div class="panel"><div class="panel-title">Harmony Mode</div>
<div class="mode-grid">
<button class="mode-btn active" onclick="setMode('analogous',this)">Analogous</button>
<button class="mode-btn" onclick="setMode('complementary',this)">Complementary</button>
<button class="mode-btn" onclick="setMode('triadic',this)">Triadic</button>
<button class="mode-btn" onclick="setMode('monochromatic',this)">Monochromatic</button>
<button class="mode-btn" onclick="setMode('tetradic',this)">Tetradic</button>
<button class="mode-btn" onclick="setMode('split',this)">Split Comp</button>
</div>
</div>
<div class="panel"><div class="panel-title">Saved Palettes</div>
<div class="saved-grid" id="savedGrid"></div>
<button class="btn primary" onclick="savePalette()" style="width:100%;margin-top:4px">💾 Save Current</button>
</div>
</div>
<div class="main">
<div class="panel"><div class="panel-title">Palette Preview</div>
<div class="palette-grid" id="paletteGrid"></div>
<div class="prop-row" style="margin-top:4px"><label>Brightness</label><input type="range" id="brightness" min="50" max="200" value="100" oninput="generatePalette()"><span class="val" id="brightVal">100%</span></div>
</div>
<div class="panel"><div class="panel-title">Generated CSS Variables</div>
<pre class="css-out" id="cssOutput">/* CSS Custom Properties */</pre>
<button class="btn primary" onclick="copyCSS()" style="margin-top:4px">📋 Copy CSS</button>
</div>
</div></div></div>
<script>
let currentPalette=[],savedPalettes=[],mode='analogous',locked={};
let currentHue=186,currentSat=80,currentLight=50;

function hslToHex(h,s,l){
  s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};const r=Math.round(255*f(0)),g=Math.round(255*f(8)),b=Math.round(255*f(4));return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')
}
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0,l=(max+min)/2;
  if(max!==min){const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}h*=60}
  return{h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)}
}

function syncColor(source,val){
  if(source==='hue'){currentHue=parseInt(val)}else if(source==='sat'){currentSat=parseInt(val)}else{currentLight=parseInt(val)}
  document.getElementById('hueVal').textContent=currentHue+'°';
  document.getElementById('satVal').textContent=currentSat+'%';
  document.getElementById('lightVal').textContent=currentLight+'%';
  const hex=hslToHex(currentHue,currentSat,currentLight);
  document.getElementById('baseColor').value=hex;
  generatePalette();
}

function setMode(newMode,btn){
  mode=newMode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  generatePalette();
}

function generatePalette(){
  const baseHex=document.getElementById('baseColor').value;
  const hsl=hexToHsl(baseHex);
  currentHue=hsl.h;currentSat=hsl.s;currentLight=hsl.l;
  document.getElementById('hueSlider').value=currentHue;
  document.getElementById('satSlider').value=currentSat;
  document.getElementById('lightSlider').value=currentLight;
  document.getElementById('hueVal').textContent=currentHue+'°';
  document.getElementById('satVal').textContent=currentSat+'%';
  document.getElementById('lightVal').textContent=currentLight+'%';
  const bright=parseInt(document.getElementById('brightness').value)/100;
  document.getElementById('brightVal').textContent=Math.round(bright*100)+'%';

  const h=currentHue,s=Math.round(currentSat*bright),l=Math.round(currentLight*bright);
  const offsets={analogous:[0,30,60,90,-30,-60],complementary:[0,180,20,200,-20,-40],triadic:[0,120,240,30,150,270],monochromatic:[0,0,0,0,0,0],tetradic:[0,90,180,270,45,135],split:[0,150,210,30,180,330]};
  const mOffsets=offsets[mode]||offsets.analogous;
  const monoL=[l,Math.round(l*0.7),Math.round(l*1.3),Math.round(l*0.5),Math.round(l*1.6),Math.round(l*0.85)];

  currentPalette=mOffsets.map((off,i)=>{
    const isLocked=locked[i];
    const hu=isLocked?currentPalette[i]?.h||(h+off+360)%360:(h+off+360)%360;
    const sa=mode==='monochromatic'?Math.max(10,Math.round(s*(1-Math.abs(i-2)*0.15))):s;
    const lu=mode==='monochromatic'?Math.min(90,Math.max(10,monoL[i])):Math.max(10,Math.min(90,l+Math.sin(i*1.2)*15));
    const hex=hslToHex(hu,sa,lu);
    return{h:hu,s:sa,l:lu,hex,locked:!!isLocked};
  });
  renderPalette();
  updateCSS();
  saveToStorage();
}

function renderPalette(){
  const grid=document.getElementById('paletteGrid');
  grid.innerHTML=currentPalette.map((c,i)=>`<div class="palette-item" style="background:${c.hex};${isLight(c.hex)?'color:#333':'color:#fff'}" onclick="copyColor('${c.hex}')">
    <button class="lock${c.locked?' locked':''}" onclick="event.stopPropagation();toggleLock(${i})">${c.locked?'🔓':'🔒'}</button>
    <span class="hex">${c.hex}</span>
  </div>`).join('');
}

function toggleLock(i){locked[i]=!locked[i];generatePalette()}
function isLight(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000>155}
function copyColor(hex){navigator.clipboard.writeText(hex).then(()=>showToast('Copied '+hex))}

function updateCSS(){
  let vars=':root {\n';
  currentPalette.forEach((c,i)=>{vars+=`  --color-${i+1}: ${c.hex};\n`});
  vars+='\n  /* Usage */\n  --primary: var(--color-1);\n  --secondary: var(--color-2);\n  --accent: var(--color-3);\n}';
  document.getElementById('cssOutput').textContent=vars;
}

function copyCSS(){navigator.clipboard.writeText(document.getElementById('cssOutput').textContent).then(()=>showToast('CSS variables copied!'))}
function showToast(m){const t=document.createElement('div');t.textContent=m;Object.assign(t.style,{position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',background:'rgba(0,217,255,0.15)',color:'#00d9ff',padding:'6px 16px',borderRadius:'4px',fontSize:'0.55rem',zIndex:999,transition:'opacity 0.2s',border:'1px solid rgba(0,217,255,0.2)'});document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2000)}

function savePalette(){
  const name=prompt('Palette name:','Palette '+(savedPalettes.length+1));
  if(!name)return;
  savedPalettes.push({name,colors:currentPalette.map(c=>({hex:c.hex})),mode});
  renderSaved();saveToStorage();
}

function loadSavedPalette(p){currentPalette=p.colors.map(c=>{const h=hexToHsl(c.hex);return{hex:c.hex,h:h.h,s:h.s,l:h.l}});renderPalette();updateCSS()}
function deleteSaved(i){savedPalettes.splice(i,1);renderSaved();saveToStorage()}

function renderSaved(){
  const grid=document.getElementById('savedGrid');
  if(!savedPalettes.length){grid.innerHTML='<div style="color:#555;font-size:0.4rem;grid-column:1/-1;text-align:center;padding:8px">No saved palettes</div>';return}
  grid.innerHTML=savedPalettes.map((p,i)=>`<div class="saved-palette" onclick="loadSavedPalette(savedPalettes[${i}])"><div class="mini-swatches">${p.colors.slice(0,5).map(c=>`<div class="mini-swatch" style="background:${c.hex}"></div>`).join('')}</div><div class="p-name">${escapeHTML(p.name)} <span onclick="event.stopPropagation();deleteSaved(${i})" style="color:#444;cursor:pointer;float:right">✕</span></div></div>`).join('');
}

function saveToStorage(){try{localStorage.setItem('colorpalette_data',JSON.stringify({currentPalette,savedPalettes,mode,locked,currentHue,currentSat,currentLight,brightness:document.getElementById('brightness').value,baseColor:document.getElementById('baseColor').value}))}catch(e){}}
function loadFromStorage(){try{const d=JSON.parse(localStorage.getItem('colorpalette_data'));if(d&&d.currentPalette){currentPalette=d.currentPalette;savedPalettes=d.savedPalettes||[];mode=d.mode||'analogous';locked=d.locked||{};currentHue=d.currentHue||186;currentSat=d.currentSat||80;currentLight=d.currentLight||50;document.getElementById('brightness').value=d.brightness||'100';document.getElementById('baseColor').value=d.baseColor||'#00d9ff';document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase().includes(mode)));renderPalette();renderSaved();updateCSS();return true}}catch(e){}return false}
function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
if(!loadFromStorage())generatePalette();else{renderSaved()}
</script></body></html>
