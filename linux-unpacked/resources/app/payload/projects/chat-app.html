<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container { max-width: 520px; width: 100%; height: 90vh; display: flex; flex-direction: column; }
h1 { color: #00d9ff; font-size: 1.3rem; text-align: center; margin-bottom: 2px; }
.subtitle { color: #666; font-size: 0.72rem; text-align: center; margin-bottom: 10px; }
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: linear-gradient(145deg, #1a1a2e, #1e1e3a);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,0,0,0.2);
}
.chat-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00d9ff, #0099ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}
.chat-info { flex: 1; }
.chat-name { font-size: 0.9rem; font-weight: 600; color: #e0e0f0; }
.chat-status {
  font-size: 0.65rem;
  color: #4ade80;
  display: flex;
  align-items: center;
  gap: 4px;
}
.chat-status::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #4ade80;
  display: inline-block;
}
.chat-actions { display: flex; gap: 4px; }
.chat-actions button {
  width: 32px; height: 32px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
  color: #666;
  cursor: pointer;
  font-size: 0.8rem;
  transition: 0.15s;
}
.chat-actions button:hover { background: rgba(255,255,255,0.08); color: #aaa; }
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.date-separator {
  text-align: center;
  font-size: 0.65rem;
  color: #444;
  padding: 8px 0;
  position: relative;
}
.date-separator::before, .date-separator::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 30%;
  height: 1px;
  background: rgba(255,255,255,0.04);
}
.date-separator::before { left: 0; }
.date-separator::after { right: 0; }
.message {
  display: flex;
  gap: 8px;
  max-width: 85%;
  animation: msgIn 0.2s ease-out;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.sent { align-self: flex-end; flex-direction: row-reverse; }
.message.received { align-self: flex-start; }
.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: 0.6rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 6px;
}
.message.sent .msg-avatar { background: #00d9ff; color: #0f0f1a; }
.message.received .msg-avatar { background: #a78bfa; color: #fff; }
.msg-content { max-width: 100%; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 0.85rem;
  line-height: 1.5;
  word-wrap: break-word;
}
.message.sent .msg-bubble {
  background: linear-gradient(135deg, #00d9ff, #0099ff);
  color: #0f0f1a;
  border-bottom-right-radius: 4px;
}
.message.received .msg-bubble {
  background: rgba(255,255,255,0.06);
  color: #d0d0e0;
  border-bottom-left-radius: 4px;
}
.msg-time {
  font-size: 0.6rem;
  color: #555;
  margin-top: 2px;
  padding: 0 4px;
}
.message.sent .msg-time { text-align: right; }
.msg-status {
  font-size: 0.6rem;
  color: #00d9ff;
  text-align: right;
  margin-top: 1px;
}
.msg-image {
  max-width: 200px;
  border-radius: 8px;
  margin-top: 4px;
}
.input-area {
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: rgba(0,0,0,0.2);
}
.input-area input {
  flex: 1;
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  color: #ccc;
  font-size: 0.85rem;
  outline: none;
  font-family: inherit;
  resize: none;
  max-height: 80px;
  line-height: 1.4;
}
.input-area input:focus { border-color: #00d9ff; }
.send-btn {
  width: 42px; height: 42px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #00d9ff, #0099ff);
  color: #0f0f1a;
  font-size: 1.1rem;
  cursor: pointer;
  transition: 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,217,255,0.3); }
.send-btn:active { transform: scale(0.95); }
.typing-indicator {
  padding: 4px 16px;
  font-size: 0.7rem;
  color: #666;
  font-style: italic;
  display: none;
  align-items: center;
  gap: 4px;
}
.typing-indicator.show { display: flex; }
.typing-dots { display: flex; gap: 2px; }
.typing-dots span {
  width: 5px; height: 5px;
  background: #666;
  border-radius: 50%;
  animation: dotPulse 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
  0%, 60%, 100% { opacity: 0.3; }
  30% { opacity: 1; }
}
.quick-replies {
  display: flex;
  gap: 4px;
  padding: 4px 12px 8px;
  overflow-x: auto;
  flex-shrink: 0;
}
.quick-reply {
  padding: 4px 12px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
  color: #888;
  font-size: 0.7rem;
  cursor: pointer;
  white-space: nowrap;
  transition: 0.15s;
  font-family: inherit;
}
.quick-reply:hover { border-color: #00d9ff; color: #00d9ff; background: rgba(0,217,255,0.06); }
.unread-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #f87171;
  color: #fff;
  font-size: 0.6rem;
  font-weight: 600;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  padding: 0 5px;
}
@media (max-width: 500px) {
  .container { height: 100vh; padding: 0; }
  body { padding: 0; }
}
</style>
</head>
<body>
<div class="container">
  <h1>💬 Chat</h1>
  <p class="subtitle">Simulated messaging experience</p>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-avatar">🤖</div>
      <div class="chat-info">
        <div class="chat-name">AI Assistant</div>
        <div class="chat-status">Online</div>
      </div>
      <div class="chat-actions">
        <button onclick="clearChat()" title="Clear Chat">🗑</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typingIndicator">
      <span>AI is typing</span>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
    <div class="quick-replies" id="quickReplies"></div>
    <div class="input-area">
      <input id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}" autofocus>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>
<script>
const RESPONSES = {
  'hello': ['Hello! How can I help you today?', 'Hi there! What can I do for you?', 'Hey! Welcome to the chat.'],
  'how are you': ['I\'m doing great, thanks for asking!', 'All systems operational! How can I help?', 'Doing well! Ready to assist you.'],
  'help': ['I can help with questions, tasks, or just chat! Try asking me something.', 'Sure! I can answer questions, provide information, or just have a conversation.'],
  'weather': ['I don\'t have access to real-time weather data in this demo, but I can recommend checking weather.com!', 'Weather info would need an API key, but this is a simulated chat demo.'],
  'time': [`The current time is ${new Date().toLocaleTimeString()}`, `It's ${new Date().toLocaleTimeString()} where this server is located.`],
  'name': ['I\'m your AI Assistant!', 'You can call me ChatBot!', 'I\'m the AI Assistant, at your service!'],
  'bye': ['Goodbye! Have a great day!', 'See you later!', 'Bye! Come back anytime.'],
  'thanks': ['You\'re welcome!', 'Happy to help!', 'Anytime!', 'My pleasure!'],
  'code': ['I can help with code! What language are you using?', 'Sure! Describe what you need and I\'ll help with the code.'],
  'joke': ['Why do programmers prefer dark mode? Because light attracts bugs!', 'What do you call a fake noodle? An impasta!', 'Why did the developer go broke? Because he used up all his cache!'],
  'default': [
    'That\'s interesting! Tell me more about that.',
    'Great question! In this demo chat, I respond based on keywords.',
    'I see! I\'m a simulated AI assistant for this demo application.',
    'Thanks for your message! This chat demonstrates real-time messaging.',
    'Good point! This app showcases a complete chat interface.',
    'I hear you! Feel free to ask me anything else.',
    'Interesting topic! This demo chat supports quick replies too.',
  ]
};

const QUICK_REPLIES = ['Hello!', 'Help', 'Tell me a joke', 'What is your name?', 'Thanks', 'Bye'];

let messages = [];
let currentUser = 'You';

function loadData() {
  try {
    const saved = localStorage.getItem('chat-messages');
    if (saved) {
      messages = JSON.parse(saved);
      return;
    }
  } catch {}
  
  // Seed messages
  const now = Date.now();
  messages = [
    { id: 's1', text: 'Hello! Welcome to the chat demo. 👋', sender: 'ai', time: now - 120000 },
    { id: 's2', text: 'This is a simulated chat application that demonstrates real-time messaging.', sender: 'ai', time: now - 110000 },
    { id: 's3', text: 'Try sending a message or clicking a quick reply below!', sender: 'ai', time: now - 100000 },
    { id: 's4', text: 'Hi! This looks great!', sender: 'user', time: now - 80000 },
    { id: 's5', text: "Thanks! I'm an AI assistant simulation. How can I help you today?", sender: 'ai', time: now - 70000 },
  ];
}

function saveData() {
  localStorage.setItem('chat-messages', JSON.stringify(messages));
}

function formatTime(timestamp) {
  const d = new Date(timestamp);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  
  if (isToday) return time;
  const yesterday = new Date(now.getTime() - 86400000);
  if (d.toDateString() === yesterday.toDateString()) return `Yesterday ${time}`;
  return `${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} ${time}`;
}

function escapeHTML(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function scrollToBottom() {
  const container = document.getElementById('messages');
  setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
}

function render() {
  const container = document.getElementById('messages');
  let lastDate = '';
  
  container.innerHTML = messages.map(msg => {
    const d = new Date(msg.time);
    const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const dateSeparator = dateStr !== lastDate ? `<div class="date-separator">${dateStr}</div>` : '';
    lastDate = dateStr;
    
    const isUser = msg.sender === 'user';
    return `
      ${dateSeparator}
      <div class="message ${isUser ? 'sent' : 'received'}">
        <div class="msg-avatar">${isUser ? '👤' : '🤖'}</div>
        <div class="msg-content">
          <div class="msg-bubble">${escapeHTML(msg.text)}</div>
          <div class="msg-time">${formatTime(msg.time)}</div>
          ${isUser ? '<div class="msg-status">✓✓</div>' : ''}
        </div>
      </div>
    `;
  }).join('');
  
  scrollToBottom();
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  
  input.value = '';
  
  // Add user message
  messages.push({
    id: 'msg_' + Date.now(),
    text,
    sender: 'user',
    time: Date.now(),
  });
  
  saveData();
  render();
  
  // Show typing indicator
  const typing = document.getElementById('typingIndicator');
  typing.classList.add('show');
  
  // Simulate AI response after delay
  const delay = 1000 + Math.random() * 2000;
  setTimeout(() => {
    typing.classList.remove('show');
    const response = generateResponse(text);
    messages.push({
      id: 'msg_' + Date.now(),
      text: response,
      sender: 'ai',
      time: Date.now(),
    });
    saveData();
    render();
  }, delay);
}

function generateResponse(text) {
  const lower = text.toLowerCase();
  
  for (const [key, responses] of Object.entries(RESPONSES)) {
    if (key === 'default') continue;
    if (lower.includes(key)) {
      return responses[Math.floor(Math.random() * responses.length)];
    }
  }
  
  // Check for question marks
  if (lower.includes('?')) {
    return RESPONSES.default[Math.floor(Math.random() * RESPONSES.default.length)];
  }
  
  return RESPONSES.default[Math.floor(Math.random() * RESPONSES.default.length)];
}

function quickReply(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

function renderQuickReplies() {
  const container = document.getElementById('quickReplies');
  container.innerHTML = QUICK_REPLIES.map(text => 
    `<button class="quick-reply" onclick="quickReply('${text}')">${text}</button>`
  ).join('');
}

function clearChat() {
  if (!confirm('Clear all messages?')) return;
  messages = [];
  saveData();
  render();
}

function addQuickReply(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

loadData();
render();
renderQuickReplies();
</script>
</body>
</html>
