<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Manager</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.container { max-width: 900px; width: 100%; }
h1 { color: #00d9ff; font-size: 1.5rem; text-align: center; margin-bottom: 4px; }
.subtitle { color: #666; font-size: 0.8rem; text-align: center; margin-bottom: 16px; }
/* Generator */
.generator {
  background: linear-gradient(145deg, #1a1a2e, #1e1e3a);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
}
.generator h2 { color: #ccc; font-size: 1rem; margin-bottom: 16px; }
.gen-output {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.gen-output input {
  flex: 1;
  padding: 12px 16px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  color: #00d9ff;
  font-size: 1.1rem;
  font-family: 'Courier New', monospace;
  outline: none;
  letter-spacing: 1px;
}
.gen-output input:focus { border-color: #00d9ff; }
.gen-output .btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: 0.2s;
}
.btn-copy { background: rgba(0,217,255,0.1); color: #00d9ff; border: 1px solid rgba(0,217,255,0.2); }
.btn-copy:hover { background: rgba(0,217,255,0.2); }
.btn-regen { background: linear-gradient(135deg, #00d9ff, #0099ff); color: #0f0f1a; }
.btn-regen:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,217,255,0.3); }
.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.option-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
}
.option-item label { font-size: 0.8rem; color: #aaa; cursor: pointer; }
.option-item input[type="checkbox"] { accent-color: #00d9ff; width: 16px; height: 16px; }
.length-control { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.length-control label { font-size: 0.8rem; color: #aaa; }
.length-control input[type="range"] { flex: 1; accent-color: #00d9ff; }
.length-control .len-val { font-size: 0.9rem; color: #00d9ff; font-weight: 600; min-width: 30px; text-align: center; }
/* Strength meter */
.strength-meter {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  margin-bottom: 16px;
}
.strength-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
}
.strength-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s, background 0.3s;
}
.strength-label { font-size: 0.75rem; font-weight: 600; min-width: 70px; text-align: right; }
/* Vault */
.vault {
  background: linear-gradient(145deg, #1a1a2e, #1e1e3a);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
}
.vault-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.vault-header h2 { color: #ccc; font-size: 1rem; }
.vault-header .entry-count { font-size: 0.75rem; color: #666; }
.vault-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.vault-search {
  flex: 1;
  padding: 8px 12px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  color: #ccc;
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
  min-width: 150px;
}
.vault-search:focus { border-color: #00d9ff; }
.vault-filter {
  padding: 8px 12px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  color: #aaa;
  font-size: 0.8rem;
  font-family: inherit;
  outline: none;
}
.btn-vault {
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: 0.2s;
  white-space: nowrap;
}
.btn-add { background: linear-gradient(135deg, #00d9ff, #0099ff); color: #0f0f1a; }
.btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,217,255,0.3); }
.btn-export { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #aaa; }
.btn-export:hover { background: rgba(255,255,255,0.1); }
.entry-list { display: flex; flex-direction: column; gap: 8px; }
.entry-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  transition: 0.15s;
}
.entry-item:hover { border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); }
.entry-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: rgba(0,217,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.entry-info { flex: 1; min-width: 0; }
.entry-site { font-size: 0.85rem; color: #ddd; font-weight: 500; }
.entry-username { font-size: 0.7rem; color: #555; }
.entry-password {
  font-family: 'Courier New', monospace;
  font-size: 0.85rem;
  color: #666;
  letter-spacing: 1px;
  padding: 4px 8px;
  background: rgba(0,0,0,0.2);
  border-radius: 4px;
  cursor: pointer;
  transition: 0.15s;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry-password:hover { color: #00d9ff; }
.entry-actions { display: flex; gap: 4px; }
.entry-actions .btn-sm {
  padding: 4px 8px;
  border: none;
  border-radius: 6px;
  font-size: 0.7rem;
  cursor: pointer;
  background: rgba(255,255,255,0.05);
  color: #666;
  transition: 0.15s;
  font-family: inherit;
}
.entry-actions .btn-sm:hover { background: rgba(255,255,255,0.1); color: #ddd; }
.entry-actions .btn-sm.danger:hover { background: rgba(248,113,113,0.15); color: #f87171; }
.empty-vault { text-align: center; padding: 30px; color: #555; font-size: 0.85rem; }
.entry-category {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(0,217,255,0.08);
  color: #00d9ff;
  display: inline-block;
  margin-top: 2px;
}
/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1a1a2e;
  border: 1px solid rgba(0,217,255,0.3);
  border-radius: 10px;
  padding: 10px 20px;
  color: #00d9ff;
  font-size: 0.85rem;
  opacity: 0;
  transition: 0.3s;
  z-index: 100;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: #1a1a2e;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
  width: 90%;
  max-width: 420px;
}
.modal h2 { color: #00d9ff; font-size: 1.1rem; margin-bottom: 16px; }
.modal label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 4px; margin-top: 8px; }
.modal label:first-of-type { margin-top: 0; }
.modal input, .modal select {
  width: 100%;
  padding: 8px 12px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  color: #ccc;
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
}
.modal input:focus, .modal select:focus { border-color: #00d9ff; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s; }
.btn-primary { background: linear-gradient(135deg, #00d9ff, #0099ff); color: #0f0f1a; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,217,255,0.3); }
.btn-secondary { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #aaa; }
.btn-secondary:hover { background: rgba(255,255,255,0.1); }
@media (max-width: 500px) {
  .vault-header { flex-direction: column; align-items: flex-start; gap: 8px; }
  .vault-controls { flex-direction: column; }
  .entry-item { flex-wrap: wrap; }
  .entry-password { max-width: 100px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>🔐 Password Manager</h1>
  <p class="subtitle">Generate, store, and manage secure passwords</p>
  <div class="generator">
    <h2>🔑 Password Generator</h2>
    <div class="gen-output">
      <input id="passwordOutput" readonly value="P@ssw0rd!Secure1">
      <button class="btn btn-copy" onclick="copyPassword()">📋 Copy</button>
      <button class="btn btn-regen" onclick="generatePassword()">🔄 Regenerate</button>
    </div>
    <div class="length-control">
      <label>Length: <span class="len-val" id="lenVal">16</span></label>
      <input type="range" min="6" max="64" value="16" id="lengthRange" oninput="updateLength(this.value)">
    </div>
    <div class="options-grid">
      <div class="option-item"><input type="checkbox" id="optUpper" checked onchange="generatePassword()"><label for="optUpper">A-Z</label></div>
      <div class="option-item"><input type="checkbox" id="optLower" checked onchange="generatePassword()"><label for="optLower">a-z</label></div>
      <div class="option-item"><input type="checkbox" id="optDigits" checked onchange="generatePassword()"><label for="optDigits">0-9</label></div>
      <div class="option-item"><input type="checkbox" id="optSymbols" checked onchange="generatePassword()"><label for="optSymbols">!@#$%</label></div>
      <div class="option-item"><input type="checkbox" id="optAmbiguous" onchange="generatePassword()"><label for="optAmbiguous">Ambiguous</label></div>
    </div>
    <div class="strength-meter">
      <span style="font-size:0.8rem;color:#888;">Strength</span>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:80%;background:#4ade80"></div></div>
      <span class="strength-label" id="strengthLabel" style="color:#4ade80">Strong</span>
    </div>
  </div>
  <div class="vault">
    <div class="vault-header">
      <h2>🏦 Password Vault</h2>
      <span class="entry-count" id="entryCount">0 entries</span>
    </div>
    <div class="vault-controls">
      <input class="vault-search" id="vaultSearch" placeholder="🔍 Search entries..." oninput="renderVault()">
      <select class="vault-filter" id="vaultFilter" onchange="renderVault()">
        <option value="all">All Categories</option>
        <option value="Web">Web</option>
        <option value="Email">Email</option>
        <option value="Finance">Finance</option>
        <option value="Social">Social</option>
        <option value="Work">Work</option>
        <option value="Other">Other</option>
      </select>
      <button class="btn-vault btn-add" onclick="openAddModal()">+ Add Entry</button>
      <button class="btn-vault btn-export" onclick="exportVault()">📤 Export</button>
    </div>
    <div class="entry-list" id="entryList">
      <div class="empty-vault">🔒 No passwords saved yet. Click "Add Entry" to get started!</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="entryModal">
  <div class="modal">
    <h2 id="modalTitle">Add Entry</h2>
    <label>Site / App Name</label>
    <input id="edSite" placeholder="e.g. github.com">
    <label>Username / Email</label>
    <input id="edUsername" placeholder="user@example.com">
    <label>Password</label>
    <input id="edPassword" placeholder="Generated or custom password">
    <label>Category</label>
    <select id="edCategory">
      <option value="Web">🌐 Web</option>
      <option value="Email">📧 Email</option>
      <option value="Finance">💰 Finance</option>
      <option value="Social">👥 Social</option>
      <option value="Work">💼 Work</option>
      <option value="Other">📦 Other</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let vault = [];
let editingId = null;
const CATEGORY_ICONS = { 'Web': '🌐', 'Email': '📧', 'Finance': '💰', 'Social': '👥', 'Work': '💼', 'Other': '📦' };

function loadVault() {
  try { const d = localStorage.getItem('pm-vault'); if (d) vault = JSON.parse(d); } catch {}
}
function saveVault() { localStorage.setItem('pm-vault', JSON.stringify(vault)); renderVault(); }

function generatePassword() {
  const len = parseInt(document.getElementById('lengthRange').value);
  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const digits = '0123456789';
  const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
  const ambiguous = 'il1Lo0O';
  let chars = '';
  if (document.getElementById('optUpper').checked) chars += upper;
  if (document.getElementById('optLower').checked) chars += lower;
  if (document.getElementById('optDigits').checked) chars += digits;
  if (document.getElementById('optSymbols').checked) chars += symbols;
  if (!document.getElementById('optAmbiguous').checked) {
    for (const c of ambiguous) chars = chars.replaceAll(c, '');
  }
  if (!chars) { document.getElementById('passwordOutput').value = 'Select options!'; return; }
  let pwd = '';
  for (let i = 0; i < len; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('passwordOutput').value = pwd;
  updateStrength(pwd);
}

function updateLength(val) {
  document.getElementById('lenVal').textContent = val;
  generatePassword();
}

function updateStrength(pwd) {
  let score = 0;
  if (pwd.length >= 8) score += 20;
  if (pwd.length >= 12) score += 15;
  if (pwd.length >= 16) score += 15;
  if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score += 15;
  if (/\d/.test(pwd)) score += 10;
  if (/[^a-zA-Z0-9]/.test(pwd)) score += 15;
  if (/(.)\1{2,}/.test(pwd)) score -= 10;
  score = Math.max(0, Math.min(100, score));
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  if (score < 25) { fill.style.width = score + '%'; fill.style.background = '#f87171'; label.textContent = 'Weak'; label.style.color = '#f87171'; }
  else if (score < 50) { fill.style.width = score + '%'; fill.style.background = '#fb923c'; label.textContent = 'Fair'; label.style.color = '#fb923c'; }
  else if (score < 75) { fill.style.width = score + '%'; fill.style.background = '#fbbf24'; label.textContent = 'Good'; label.style.color = '#fbbf24'; }
  else { fill.style.width = score + '%'; fill.style.background = '#4ade80'; label.textContent = 'Strong'; label.style.color = '#4ade80'; }
}

function copyPassword() {
  const input = document.getElementById('passwordOutput');
  navigator.clipboard.writeText(input.value).then(() => showToast('📋 Password copied!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function renderVault() {
  const search = document.getElementById('vaultSearch').value.toLowerCase();
  const filter = document.getElementById('vaultFilter').value;
  const list = document.getElementById('entryList');
  document.getElementById('entryCount').textContent = vault.length + ' entries';
  let filtered = vault;
  if (filter !== 'all') filtered = filtered.filter(e => e.category === filter);
  if (search) filtered = filtered.filter(e => e.site.toLowerCase().includes(search) || e.username.toLowerCase().includes(search));
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-vault">🔍 No matching entries found</div>'; return;
  }
  list.innerHTML = filtered.map(entry => `
    <div class="entry-item">
      <div class="entry-icon">${CATEGORY_ICONS[entry.category] || '📦'}</div>
      <div class="entry-info">
        <div class="entry-site">${escapeHTML(entry.site)}</div>
        <div class="entry-username">${escapeHTML(entry.username)}</div>
        <span class="entry-category">${escapeHTML(entry.category)}</span>
      </div>
      <div class="entry-password" onclick="togglePasswordVisible('${entry.id}')" id="pwd-${entry.id}">${'•'.repeat(Math.min(20, (entry.password || '').length))}</div>
      <div class="entry-actions">
        <button class="btn-sm" onclick="editEntry('${entry.id}')">✏️</button>
        <button class="btn-sm danger" onclick="deleteEntry('${entry.id}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

let passwordVisible = {};
function togglePasswordVisible(id) {
  const entry = vault.find(e => e.id === id);
  if (!entry) return;
  passwordVisible[id] = !passwordVisible[id];
  const el = document.getElementById('pwd-' + id);
  if (el) el.textContent = passwordVisible[id] ? entry.password : '•'.repeat(Math.min(20, (entry.password || '').length));
}

function escapeHTML(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '➕ Add New Entry';
  document.getElementById('edSite').value = '';
  document.getElementById('edUsername').value = '';
  document.getElementById('edPassword').value = document.getElementById('passwordOutput').value;
  document.getElementById('edCategory').value = 'Web';
  document.getElementById('modalSaveBtn').textContent = 'Add Entry';
  document.getElementById('entryModal').classList.add('open');
  document.getElementById('edSite').focus();
}

function editEntry(id) {
  const entry = vault.find(e => e.id === id);
  if (!entry) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '✏️ Edit Entry';
  document.getElementById('edSite').value = entry.site;
  document.getElementById('edUsername').value = entry.username;
  document.getElementById('edPassword').value = entry.password;
  document.getElementById('edCategory').value = entry.category;
  document.getElementById('modalSaveBtn').textContent = 'Update';
  document.getElementById('entryModal').classList.add('open');
}

function closeModal() { document.getElementById('entryModal').classList.remove('open'); editingId = null; }

function saveEntry() {
  const site = document.getElementById('edSite').value.trim();
  const username = document.getElementById('edUsername').value.trim();
  const password = document.getElementById('edPassword').value.trim();
  const category = document.getElementById('edCategory').value;
  if (!site || !username || !password) { alert('Please fill in all fields'); return; }
  if (editingId) {
    const idx = vault.findIndex(e => e.id === editingId);
    if (idx >= 0) { vault[idx] = { ...vault[idx], site, username, password, category }; }
  } else {
    vault.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,6), site, username, password, category, created: new Date().toISOString() });
  }
  saveVault();
  closeModal();
  showToast(editingId ? '✅ Entry updated!' : '✅ Entry saved!');
}

function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  vault = vault.filter(e => e.id !== id);
  saveVault();
  showToast('🗑️ Entry deleted');
}

function exportVault() {
  const data = JSON.stringify(vault.map(e => ({ site: e.site, username: e.username, password: e.password, category: e.category })), null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'passwords-export.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📤 Vault exported!');
}

loadVault();
generatePassword();
renderVault();
</script>
</body>
</html>
