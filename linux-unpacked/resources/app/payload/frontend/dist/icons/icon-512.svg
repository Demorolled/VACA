<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#667eea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Neural network nodes -->
  <circle cx="160" cy="160" r="24" fill="#00d9ff" opacity="0.8"/>
  <circle cx="256" cy="116" r="24" fill="#667eea" opacity="0.8"/>
  <circle cx="352" cy="160" r="24" fill="#a855f7" opacity="0.8"/>
  <circle cx="160" cy="256" r="24" fill="#4ade80" opacity="0.8"/>
  <circle cx="256" cy="256" r="36" fill="url(#accent)"/>
  <circle cx="352" cy="256" r="24" fill="#fbbf24" opacity="0.8"/>
  <circle cx="160" cy="352" r="24" fill="#f87171" opacity="0.8"/>
  <circle cx="256" cy="396" r="24" fill="#4ade80" opacity="0.8"/>
  <circle cx="352" cy="352" r="24" fill="#60a5fa" opacity="0.8"/>
  <!-- Connections -->
  <line x1="160" y1="160" x2="256" y2="116" stroke="#00d9ff" stroke-width="4" opacity="0.4"/>
  <line x1="256" y1="116" x2="352" y2="160" stroke="#667eea" stroke-width="4" opacity="0.4"/>
  <line x1="160" y1="160" x2="160" y2="256" stroke="#00d9ff" stroke-width="4" opacity="0.4"/>
  <line x1="352" y1="160" x2="352" y2="256" stroke="#a855f7" stroke-width="4" opacity="0.4"/>
  <line x1="160" y1="256" x2="256" y2="256" stroke="#4ade80" stroke-width="4" opacity="0.4"/>
  <line x1="256" y1="256" x2="352" y2="256" stroke="#fbbf24" stroke-width="4" opacity="0.4"/>
  <line x1="160" y1="256" x2="160" y2="352" stroke="#4ade80" stroke-width="4" opacity="0.4"/>
  <line x1="352" y1="256" x2="352" y2="352" stroke="#60a5fa" stroke-width="4" opacity="0.4"/>
  <line x1="256" y1="256" x2="256" y2="396" stroke="#667eea" stroke-width="4" opacity="0.4"/>
  <line x1="160" y1="352" x2="256" y2="396" stroke="#f87171" stroke-width="4" opacity="0.4"/>
  <line x1="256" y1="396" x2="352" y2="352" stroke="#4ade80" stroke-width="4" opacity="0.4"/>
  <!-- Code brackets -->
  <text x="256" y="266" text-anchor="middle" dominant-baseline="central"
        font-family="monospace" font-size="64" font-weight="bold"
        fill="#ffffff" opacity="0.9">&lt;/&gt;</text>
</svg>
