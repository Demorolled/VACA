<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Scanner Budget</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #e6edf3; background: #0d1117; }
  h1 { font-size: 1.4rem; }
  input, select { padding: .4rem; margin: .2rem .3rem .2rem 0; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; }
  button { padding: .4rem .9rem; background: #2ea043; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin: .5rem 0; }
  th, td { border: 1px solid #30363d; padding: .35rem .5rem; text-align: left; font-size: .9rem; }
  .summary { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: .8rem 1rem; margin-bottom: .8rem; }
  .muted { color: #8b949e; font-size: .85rem; }
</style>
</head>
<body>
<h1>🧾 Receipt Scanner Budget</h1>
<p class="muted">Scaffold (batch 2). Log receipts, tag categories, watch monthly totals. OCR comes next.</p>

<div class="summary">Spent this month: <strong>$<span id="monthTotal">0.00</span></strong></div>

<form id="recForm">
  <input id="recMerchant" placeholder="Merchant (e.g. Kroger)" autocomplete="off">
  <input id="recAmount" placeholder="Amount ($)" type="number" step="0.01" min="0">
  <select id="recCat">
    <option>Groceries</option><option>Gas</option><option>Dining</option>
    <option>Household</option><option>Subscriptions</option><option>Other</option>
  </select>
  <button type="submit">Add receipt</button>
</form>

<table>
  <thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Amount</th><th></th></tr></thead>
  <tbody id="recRows"></tbody>
</table>

<script>
const recs = JSON.parse(localStorage.getItem('receipts') || '[]');
function save() { localStorage.setItem('receipts', JSON.stringify(recs)); }

function render() {
  const tb = document.getElementById('recRows');
  const now = new Date();
  const monthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  let monthTotal = 0;
  tb.innerHTML = recs.map((r, i) => {
    if (r.date.startsWith(monthKey)) monthTotal += r.amount;
    return `<tr><td>${r.date}</td><td>${r.merchant}</td><td>${r.cat}</td><td>$${r.amount.toFixed(2)}</td>` +
           `<td><button data-remove="${i}">✕</button></td></tr>`;
  }).join('');
  document.getElementById('monthTotal').textContent = monthTotal.toFixed(2);
  tb.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => { recs.splice(+b.dataset.remove, 1); save(); render(); });
}

document.getElementById('recForm').onsubmit = e => {
  e.preventDefault();
  const merchant = document.getElementById('recMerchant').value.trim();
  const amount = parseFloat(document.getElementById('recAmount').value);
  const cat = document.getElementById('recCat').value;
  if (merchant && !isNaN(amount)) {
    recs.push({ date: new Date().toISOString().slice(0, 10), merchant, cat, amount });
    save(); document.getElementById('recMerchant').value = ''; document.getElementById('recAmount').value = ''; render();
  }
};

render();
</script>
</body>
</html>
