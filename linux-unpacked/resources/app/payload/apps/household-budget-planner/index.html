<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Budget Planner</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1e2733; --muted: #6b7a8d;
    --accent: #2f7de1; --good: #2e9e5b; --bad: #d64545; --line: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  header {
    background: linear-gradient(135deg, #1e3a5f, #2f7de1);
    color: #fff; padding: 22px 20px; text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 1.5rem; }
  header p { margin: 0; opacity: .85; font-size: .9rem; }
  main { max-width: 980px; margin: 0 auto; padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; box-shadow: 0 1px 3px rgba(16,24,40,.06);
  }
  .card h2 { margin: 0 0 12px; font-size: 1.05rem; }
  label { display: block; font-size: .82rem; color: var(--muted); margin: 10px 0 4px; }
  input, select, button { font: inherit; }
  input, select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  button {
    cursor: pointer; border: none; border-radius: 8px; padding: 10px 14px;
    background: var(--accent); color: #fff; font-weight: 600; margin-top: 12px;
  }
  button.secondary { background: #e8eef6; color: var(--ink); }
  button.danger { background: #fdeaea; color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; }
  .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .stat { text-align: center; }
  .stat .big { font-size: 1.6rem; font-weight: 700; }
  .stat .lbl { font-size: .78rem; color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 10px; }
  .bar { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; position: relative; min-width: 8px; }
  .bar.over { background: var(--bad); }
  .bar-label { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: .65rem; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: .9rem; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type="month"] { width: auto; }
  .filters select { width: auto; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; background: #e8eef6; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🧾 Household Budget Planner</h1>
  <p>Log receipts with vendor memory · monthly budget vs actual · yearly summary — all offline</p>
</header>

<main>
  <div class="grid">
    <!-- Add expense -->
    <section class="card">
      <h2>Add receipt</h2>
      <label for="amount">Amount ($)</label>
      <input id="amount" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
      <label for="vendor">Vendor</label>
      <input id="vendor" list="vendor-list" placeholder="Start typing — remembered vendors appear">
      <datalist id="vendor-list"></datalist>
      <label for="category">Category</label>
      <select id="category">
        <option>Groceries</option><option>Dining</option><option>Transport</option>
        <option>Utilities</option><option>Rent</option><option>Entertainment</option>
        <option>Health</option><option>Other</option>
      </select>
      <label for="date">Date</label>
      <input id="date" type="date">
      <button id="add-btn">Add expense</button>
    </section>

    <!-- Monthly summary -->
    <section class="card">
      <h2>Monthly view</h2>
      <div class="toolbar">
        <input type="month" id="month-picker">
        <button class="secondary" id="prev-month">◀</button>
        <button class="secondary" id="next-month">▶</button>
      </div>
      <div style="display:flex; gap:12px; margin-bottom:12px;">
        <div class="stat"><div class="big" id="stat-spent">$0.00</div><div class="lbl">Spent</div></div>
        <div class="stat"><div class="big" id="stat-budget">—</div><div class="lbl">Budget</div></div>
        <div class="stat"><div class="big" id="stat-left">$0.00</div><div class="lbl">Left</div></div>
      </div>
      <label for="budget-input">Monthly budget ($)</label>
      <input id="budget-input" type="number" step="1" min="0" placeholder="e.g. 1500">
      <button class="secondary" id="save-budget">Save budget</button>
    </section>
  </div>

  <!-- Monthly detail -->
  <div class="card" style="margin-top:16px;">
    <div class="toolbar">
      <h2 style="margin:0; flex:1;">Transactions</h2>
      <select id="cat-filter"><option value="">All categories</option></select>
    </div>
    <div id="txns"><div class="empty">No expenses yet this month.</div></div>
  </div>

  <!-- Yearly summary -->
  <div class="card" style="margin-top:16px;">
    <h2>Yearly summary <span id="year-label"></span></h2>
    <div class="bars" id="year-bars"></div>
    <p id="year-total" style="color:var(--muted); font-size:.85rem;"></p>
  </div>
</main>

<script>
(function () {
  "use strict";
  var LS_KEY = "hbp_data_v1";
  var data = { expenses: [], budgetByMonth: {} };   // expenses: {id, amount, vendor, category, date}
  var currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM

  function load() {
    try { var raw = localStorage.getItem(LS_KEY); if (raw) data = JSON.parse(raw); } catch (e) { /* ignore */ }
    if (!data.expenses) data.expenses = [];
    if (!data.budgetByMonth) data.budgetByMonth = {};
  }
  function save() { localStorage.setItem(LS_KEY, JSON.stringify(data)); }

  function money(n) {
    return "$" + Number(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function monthKey(d) { return (d || new Date().toISOString().slice(0, 10)).slice(0, 7); }

  function vendors() {
    var set = {};
    data.expenses.forEach(function (e) { if (e.vendor) set[e.vendor.trim().toLowerCase()] = e.vendor.trim(); });
    return Object.keys(set).map(function (k) { return set[k]; }).sort();
  }
  function refreshVendorList() {
    var dl = document.getElementById("vendor-list");
    dl.innerHTML = vendors().map(function (v) { return '<option value="' + v.replace(/"/g, "&quot;") + '">'; }).join("");
  }
  function refreshCategories() {
    var set = {};
    data.expenses.forEach(function (e) { if (e.category) set[e.category] = 1; });
    Object.keys(set).sort().forEach(function (c) {
      var sel = document.getElementById("cat-filter");
      if (!Array.prototype.some.call(sel.options, function (o) { return o.value === c; })) {
        var o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o);
      }
    });
  }

  function monthExpenses(m, cat) {
    return data.expenses.filter(function (e) {
      if (monthKey(e.date) !== m) return false;
      return !cat || e.category === cat;
    });
  }
  function monthTotal(m, cat) {
    return monthExpenses(m, cat).reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
  }

  function render() {
    var m = currentMonth;
    var picker = document.getElementById("month-picker");
    picker.value = m;
    var spent = monthTotal(m);
    var budget = Number(data.budgetByMonth[m] || 0);
    document.getElementById("stat-spent").textContent = money(spent);
    document.getElementById("stat-budget").textContent = budget ? money(budget) : "—";
    var left = budget - spent;
    var leftEl = document.getElementById("stat-left");
    leftEl.textContent = money(left);
    leftEl.className = left >= 0 ? "good" : "bad";
    document.getElementById("budget-input").value = budget || "";

    var cat = document.getElementById("cat-filter").value;
    var txns = monthExpenses(m, cat).sort(function (a, b) { return (b.date + b.id).localeCompare(a.date + a.id); });
    var box = document.getElementById("txns");
    if (!txns.length) {
      box.innerHTML = '<div class="empty">No expenses yet this month.</div>';
    } else {
      var rows = txns.map(function (e) {
        return '<tr><td>' + e.date + '</td><td>' +
          (e.vendor ? e.vendor.replace(/</g, "&lt;") : "<em>unknown</em>") + '</td><td><span class="tag">' +
          e.category + '</span></td><td class="amt">' + money(e.amount) +
          '</td><td><button class="secondary del-btn" data-id="' + e.id + '" style="padding:4px 8px;margin:0;">✕</button></td></tr>';
      }).join("");
      box.innerHTML = '<table><thead><tr><th>Date</th><th>Vendor</th><th>Category</th><th class="amt">Amount</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    }
    renderYear(m.slice(0, 4));
  }

  function renderYear(year) {
    document.getElementById("year-label").textContent = year;
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var totals = months.map(function (_, i) {
      var k = year + "-" + String(i + 1).padStart(2, "0");
      return { m: months[i], k: k, t: monthTotal(k), b: Number(data.budgetByMonth[k] || 0) };
    });
    var max = Math.max.apply(null, totals.map(function (x) { return Math.max(x.t, 1); }));
    var bars = document.getElementById("year-bars");
    bars.innerHTML = totals.map(function (x) {
      var h = Math.max(4, Math.round((x.t / max) * 100));
      return '<div class="bar' + (x.b && x.t > x.b ? " over" : "") + '" style="height:' + h + '%;" title="' + x.m + ": " + money(x.t) + '"><span class="bar-label">' + x.m + '</span></div>';
    }).join("");
    var yearTotal = totals.reduce(function (s, x) { return s + x.t; }, 0);
    var yearBudget = totals.reduce(function (s, x) { return s + (x.b || 0); }, 0);
    document.getElementById("year-total").textContent =
      "Total: " + money(yearTotal) + (yearBudget ? "  ·  Budget: " + money(yearBudget) + "  ·  " + (yearTotal <= yearBudget ? "under" : "over") + " by " + money(Math.abs(yearTotal - yearBudget)) : "");
  }

  function addExpense() {
    var amt = parseFloat(document.getElementById("amount").value);
    var vendor = document.getElementById("vendor").value.trim();
    var category = document.getElementById("category").value;
    var date = document.getElementById("date").value || new Date().toISOString().slice(0, 10);
    if (!(amt > 0)) { alert("Enter an amount greater than zero."); return; }
    data.expenses.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), amount: amt, vendor: vendor, category: category, date: date });
    save();
    document.getElementById("amount").value = "";
    document.getElementById("vendor").value = "";
    document.getElementById("date").value = "";
    refreshVendorList(); refreshCategories(); render();
  }

  document.getElementById("add-btn").addEventListener("click", addExpense);
  document.getElementById("amount").addEventListener("keydown", function (e) { if (e.key === "Enter") addExpense(); });
  document.getElementById("save-budget").addEventListener("click", function () {
    var v = parseFloat(document.getElementById("budget-input").value);
    if (v >= 0) { data.budgetByMonth[currentMonth] = v; save(); render(); }
  });
  document.getElementById("month-picker").addEventListener("change", function (e) {
    if (e.target.value) { currentMonth = e.target.value; render(); }
  });
  document.getElementById("prev-month").addEventListener("click", function () {
    var d = new Date(currentMonth + "-01T00:00:00"); d.setMonth(d.getMonth() - 1);
    currentMonth = d.toISOString().slice(0, 7); render();
  });
  document.getElementById("next-month").addEventListener("click", function () {
    var d = new Date(currentMonth + "-01T00:00:00"); d.setMonth(d.getMonth() + 1);
    currentMonth = d.toISOString().slice(0, 7); render();
  });
  document.getElementById("cat-filter").addEventListener("change", render);
  document.getElementById("txns").addEventListener("click", function (e) {
    var btn = e.target.closest(".del-btn");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    data.expenses = data.expenses.filter(function (x) { return x.id !== id; });
    save(); refreshVendorList(); refreshCategories(); render();
  });

  load(); refreshVendorList(); refreshCategories(); render();
})();
</script>
</body>
</html>
